name: Distros Build

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - ready_for_review
      - synchronize
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distros:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v6
        with:
          # If go-workspace and go-engine changes need to land together, merge go-workspace first.
          ref: main
          repository: orglang/go-workspace

      - name: Checkout engine
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: orglang/go-engine
          path: engine

      - name: Checkout SDK
        uses: actions/checkout@v6
        with:
          ref: main
          repository: orglang/go-sdk
          path: sdk

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: true
          install: false
          # Save after the explicit mise installs below so newly installed tools are cached.
          cache_save_post: true

      - name: Install distribution toolchain
        run: mise -E distros install --locked

      - name: Install engine toolchains
        working-directory: engine
        run: |
          mise -E specs install --locked
          mise -E sources install --locked

      - name: Install TypeSpec dependencies
        working-directory: engine
        run: mise run deps:install

      - name: Generate engine sources
        working-directory: engine
        run: mise -E sources exec -- task sources:generate

      # mise pins the Buildx CLI for local use; this action additionally creates and boots
      # the docker-container builder required by CI (including its BuildKit lifecycle).
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.39.0

      # Expose the Actions cache runtime variables to the inline Buildx CLI.
      - name: Expose GitHub Actions runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build distribution artifacts
        run: mise -E distros exec -- task distros

      - name: Check common stack services
        working-directory: engine
        run: mise exec -- task --dir .. stack:commons

      - name: PostgreSQL compose diagnostics
        if: ${{ failure() }}
        working-directory: stack
        run: >-
          docker compose
          -f ops/postgres.compose.yaml
          -f ops/engine.compose.yaml
          --env-file ops/commons/.env
          logs --no-color || true
