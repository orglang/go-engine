name: Specs Check

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types:
      - opened
      - ready_for_review
      - synchronize

permissions:
  contents: read

jobs:
  specs-check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Install TypeSpec dependencies
        run: mise run deps:install

      - name: Install specs toolchain
        run: mise -E specs-dev install

      - name: Check specs
        run: mise -E specs-dev exec -- task specs:check
