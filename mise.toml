[settings]
lockfile = true
experimental = true

[tools]
go = "1.27.0"
"go:github.com/go-task/task/v3/cmd/task" = "v3.54.0"

[tasks."deps:install"]
description = "Install TypeSpec dependencies"
run = "mise -E specs exec -- npm ci --prefix tsp --no-audit --no-fund"
sources = ["tsp/package.json", "tsp/package-lock.json"]
outputs = ["tsp/node_modules"]

# Reusable source groups keep stage-owned input paths in one place.
# Stage gates compose these groups to reflect the downstream impact mapping.
[task_config.input_groups]
common = [
  ".github/**",
  "taskfile.yaml",
  "**/taskfile.yaml",
  "mise.lock",
  ".miserc.toml",
]
specs = [
  "tsp/**",
  "openapi/openapi.yaml",
  "mise.specs-dev.toml",
  "mise.specs-dev.lock",
]
sources = [
  "*.go",
  "**/*.go",
  "mise.sources-dev.toml",
  "mise.sources-dev.lock",
  ".golangci.yml",
  "staticcheck.conf",
]
binaries = [
  "*.sql",
  "**/*.sql",
  "go.mod",
  "go.sum",
  "**/go.mod",
  "**/go.sum",
]
distros = [
  "Dockerfile",
  "Dockerfile.*",
  "**/Dockerfile",
  "**/Dockerfile.*",
  "*.Dockerfile",
  "**/*.Dockerfile",
  ".dockerignore",
  "compose.yaml",
  "compose.yml",
  "*.compose.yaml",
  "*.compose.yml",
  "**/compose.yaml",
  "**/compose.yml",
  "**/*.compose.yaml",
  "**/*.compose.yml",
  "mise.distros.toml",
  "mise.distros.lock",
]
# The gate chain follows the pipeline order. Each task declares only its
# own stage inputs; dependencies provide the cumulative execution order.
[tasks."specs:gate"]
description = "Run Specs in the CI pipeline"
depends = ["deps:install"]
run = "task specs:check"
sources = ["@group:common", "@group:specs"]
outputs = []

[tasks."sources:gate"]
description = "Run Specs, then Sources in the CI pipeline"
depends = ["specs:gate"]
run = "task sources:check"
sources = ["@group:sources"]
outputs = []

[tasks."binaries:gate"]
description = "Run Specs, Sources, then Binaries in the CI pipeline"
depends = ["sources:gate"]
run = "task binaries"
sources = ["@group:binaries"]
outputs = []

[tasks."distros:gate"]
description = "Run Specs, Sources, Binaries, then Distros in the CI pipeline"
depends = ["binaries:gate"]
run = "cd .. && mise -E distros run distros && mise -E distros run //:stack commons"
sources = ["@group:distros"]
outputs = []
