[tools]
node = "22"

[tasks.generate]
description = "Generate temporary API client generator prototypes"
run = "mise run generate:api-client-prototypes"

[tasks."generate:api-client-prototypes"]
description = "Compare ogen and oapi-codegen against the committed OpenAPI contract"
run = [
  "mkdir -p prototypes/api-client/ogen prototypes/api-client/oapi-codegen",
  "if GOWORK=off go run github.com/ogen-go/ogen/cmd/ogen@v1.24.0 --config prototypes/api-client/ogen.yml --target prototypes/api-client/ogen --package ogenclient --clean openapi/openapi.yaml > prototypes/api-client/ogen/generate.log 2>&1; then echo 0 > prototypes/api-client/ogen/exit-code; else echo $? > prototypes/api-client/ogen/exit-code; fi",
  "if GOWORK=off go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.2 -generate types,client -package oapiclient openapi/openapi.yaml > prototypes/api-client/oapi-codegen/client.go 2> prototypes/api-client/oapi-codegen/generate.log; then echo 0 > prototypes/api-client/oapi-codegen/exit-code; else echo $? > prototypes/api-client/oapi-codegen/exit-code; fi",
  "mkdir -p prototypes/api-client/ogen/probe-optional prototypes/api-client/ogen/probe-required",
  "if GOWORK=off go run github.com/ogen-go/ogen/cmd/ogen@v1.24.0 --target prototypes/api-client/ogen/probe-optional --package probe --clean prototypes/api-client/ogen/fixtures/optional-cycle.yaml > prototypes/api-client/ogen/probe-optional.log 2>&1; then echo 0 > prototypes/api-client/ogen/probe-optional.exit-code; else echo $? > prototypes/api-client/ogen/probe-optional.exit-code; fi",
  "if GOWORK=off go run github.com/ogen-go/ogen/cmd/ogen@v1.24.0 --target prototypes/api-client/ogen/probe-required --package probe --clean prototypes/api-client/ogen/fixtures/required-cycle.yaml > prototypes/api-client/ogen/probe-required.log 2>&1; then echo 0 > prototypes/api-client/ogen/probe-required.exit-code; else echo $? > prototypes/api-client/ogen/probe-required.exit-code; fi",
  "printf 'optional-edge exit=%s\\nrequired-edge exit=%s\\n' \"$(cat prototypes/api-client/ogen/probe-optional.exit-code)\" \"$(cat prototypes/api-client/ogen/probe-required.exit-code)\" > prototypes/api-client/ogen/probe-summary.txt",
  "test \"$(cat prototypes/api-client/ogen/oapi-codegen/exit-code 2>/dev/null || cat prototypes/api-client/oapi-codegen/exit-code)\" -eq 0",
]
