[settings]
lockfile = true
experimental = true

[tools]
go = "1.27.0"
"go:github.com/go-task/task/v3/cmd/task" = "v3.54.0"

[tasks."deps:install"]
description = "Install TypeSpec dependencies"
run = "mise -E specs exec -- npm ci --prefix tsp --no-audit --no-fund"

# Reusable source groups keep the cumulative stage impact mapping in one place.
# The order is intentional: each later stage includes all earlier-stage inputs.
[task_config.input_groups]
common = [
  ".github/**",
  "taskfile.yaml",
  "**/taskfile.yaml",
  "mise.lock",
  ".miserc.toml",
]
specs = [
  "tsp/**",
  "openapi/openapi.yaml",
  "mise.specs-dev.toml",
  "mise.specs-dev.lock",
]
sources = [
  "*.go",
  "**/*.go",
  "mise.sources-dev.toml",
  "mise.sources-dev.lock",
  ".golangci.yml",
  "staticcheck.conf",
]
binaries = [
  "*.sql",
  "**/*.sql",
  "go.mod",
  "go.sum",
  "**/go.mod",
  "**/go.sum",
]
distros = [
  "Dockerfile",
  "Dockerfile.*",
  "**/Dockerfile",
  "**/Dockerfile.*",
  "*.Dockerfile",
  "**/*.Dockerfile",
  ".dockerignore",
  "compose.yaml",
  "compose.yml",
  "*.compose.yaml",
  "*.compose.yml",
  "**/compose.yaml",
  "**/compose.yml",
  "**/*.compose.yaml",
  "**/*.compose.yml",
  "mise.distros.toml",
  "mise.distros.lock",
]
# Stage gates mirror the downstream impact mapping in .github/change-detection.md.
# Keep them independent: each CI stage has its own workflow and invokes only its gate.
# The groups above encode cumulative inputs without making gates depend on one another.
[tasks."specs:gate"]
description = "Run specs checks when specs inputs change"
run = "task specs:check"
sources = ["@group:common", "@group:specs"]
outputs = []

[tasks."sources:gate"]
description = "Run sources checks when specs or sources inputs change"
run = "task sources:check"
sources = ["@group:common", "@group:specs", "@group:sources"]
outputs = []

[tasks."binaries:gate"]
description = "Run binary checks when specs, sources, or binary inputs change"
run = "task binaries"
sources = [
  "@group:common",
  "@group:specs",
  "@group:sources",
  "@group:binaries",
]
outputs = []

[tasks."distros:gate"]
description = "Run workspace distribution checks when engine inputs change"
run = "mise run deps:install && mise -E sources exec -- task sources:generate && cd .. && mise -E distros run distros && mise -E distros run //:stack commons"
sources = [
  "@group:common",
  "@group:specs",
  "@group:sources",
  "@group:binaries",
  "@group:distros",
]
outputs = []

# Experimental cumulative pipelines. Keep the regular stage gates independent.
# Each Pipe task runs all upstream stages before its own stage.
[tasks."specs:pipe"]
description = "Run the Specs stage in the experimental pipeline"
run = "mise -E specs run specs:gate"
sources = ["@group:common", "@group:specs"]
outputs = []

[tasks."sources:pipe"]
description = "Run Specs, then Sources in the experimental pipeline"
depends = ["specs:pipe"]
run = "mise -E sources run sources:gate"
sources = ["@group:common", "@group:sources"]
outputs = []

[tasks."binaries:pipe"]
description = "Run Specs, Sources, then Binaries in the experimental pipeline"
depends = ["sources:pipe"]
run = "mise run binaries:gate"
sources = ["@group:common", "@group:binaries"]
outputs = []

[tasks."distros:pipe"]
description = "Run Specs, Sources, Binaries, then Distros in the experimental pipeline"
depends = ["binaries:pipe"]
run = "mise run distros:gate"
sources = ["@group:common", "@group:distros"]
outputs = []

[tasks."sources:lint"]
description = "Run Go lint checks"
run = "golangci-lint run ./..."
sources = ["@group:sources"]
outputs = []
