version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  disable:
    - unused # Fx constructors and handlers are discovered through reflection.
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - durationcheck
    - errname
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
    - wastedassign
  settings:
    depguard:
      rules:
        AgnosticCore:
          list-mode: lax
          files:
            - "**/core/**/*.go"
            - "**/domain/**/*.go"
            - "!**/*_test.go"
          deny:
            - {pkg: orglang/go-engine/internal/lib/db/adapter, desc: &adapterBoundary "Core/domain code must depend on a port, not an adapter."}
            - {pkg: orglang/go-engine/internal/prog/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/proc/compstep/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/proc/compconn/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/proc/connact/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/proc/compexec/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/proc/termdef/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/proc/typedef/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/proc/typeexp/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/pool/compstep/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/pool/compconn/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/pool/connact/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/pool/compexec/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/pool/compvar/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/pool/termdef/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/pool/typedef/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/pool/typeexp/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/adt/comproot/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/adt/descsem/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/adt/implsem/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/adt/typesem/adapter, desc: *adapterBoundary}
            - {pkg: github.com/jackc/pgx, desc: "Use lib/tx contracts; keep pgx in infrastructure adapters."}
        ProcCore:
          list-mode: lax
          files:
            - "**/proc/**/core/**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: orglang/go-engine/internal/pool
              desc: Process core must not depend on pool application or persistence contracts; compose them at the application boundary.
            - pkg: orglang/go-engine/internal/prog
              desc: Process core must not depend on the application composition root.
        PoolCore:
          list-mode: lax
          files:
            - "**/pool/**/core/**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: orglang/go-engine/internal/proc
              desc: Pool core must not depend on process application or persistence contracts; compose them at the application boundary.
            - pkg: orglang/go-engine/internal/prog
              desc: Pool core must not depend on the application composition root.
        Part:
          list-mode: lax
          files:
            - "**/adt/*/*.go"
            - "**/adt/*/core/**/*.go"
            - "**/adt/*/domain/**/*.go"
            - "!**/*_test.go"
          deny:
            - {pkg: orglang/go-engine/internal/adt/comproot/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/adt/descsem/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/adt/implsem/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/adt/typesem/adapter, desc: *adapterBoundary}
            - {pkg: orglang/go-engine/internal/proc, desc: "Part is the generic participant abstraction; it must not depend on the process aggregate."}
            - {pkg: orglang/go-engine/internal/pool, desc: "Part is the generic participant abstraction; it must not depend on the pool aggregate."}
            - {pkg: orglang/go-engine/internal/prog, desc: "Part is the generic participant abstraction; it must not depend on the application composition root."}
            - {pkg: github.com/jackc/pgx, desc: "Keep database drivers outside the generic participant abstraction."}
    revive:
      enable-all-rules: true
      rules:
        - name: package-comments
          disabled: true
        - name: unused-parameter
          disabled: true
        - name: unused-receiver
          disabled: true
        - name: exported
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: use-errors-new
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: add-constant
          disabled: true
        - name: function-length
          disabled: true
        - name: function-result-limit
          arguments: [4]
        - name: var-declaration
          disabled: true
        - name: line-length-limit
          disabled: true
  exclusions:
    paths:
      - internal/proto/

formatters:
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
