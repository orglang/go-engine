name: Sources Check

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]
    types:
      - opened
      - ready_for_review
      - synchronize

permissions:
  contents: read

jobs:
  sources-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check sources
        run: go run github.com/go-task/task/v3/cmd/task@v3.54.0 sources:check

      - name: Run unit tests
        run: go run github.com/go-task/task/v3/cmd/task@v3.54.0 tests:unit
