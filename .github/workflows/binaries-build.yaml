name: Binaries

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - ready_for_review
      - synchronize
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      specs: ${{ steps.detect.outputs.specs }}
      sources: ${{ steps.detect.outputs.sources }}
      binaries: ${{ steps.detect.outputs.binaries }}
    steps:
      - name: Checkout engine
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect changed areas
        id: detect
        uses: ./.github/actions/change-detection

  binaries-gate:
    name: Binaries Gate
    needs: detect-changes
    if: ${{ (needs.detect-changes.outputs.specs == 'true' || needs.detect-changes.outputs.sources == 'true' || needs.detect-changes.outputs.binaries == 'true') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: true
          cache_key: "{{default}}-binaries"
          install: true
          cache_save_post: true

      - name: Restore mise task artifact cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/mise/task-artifacts/v2
          key: mise-task-artifacts-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mise-task-artifacts-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Run affected binary checks
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            mise run --affected --affected-committed --affected-base "origin/$GITHUB_BASE_REF" --affected-head HEAD binaries:gate
          else
            mise run binaries:gate
          fi
