# Depguard matches package import paths by prefix. Keep the adapter list in sync
# when adding a new adapter package.
AgnosticCore:
  files:
    - "**/core/**/*.go"
    - "**/domain/**/*.go"
    - "!**/*_test.go"
  listMode: Lax
  deny:
    "orglang/go-engine/lib/db/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/prog/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/proc/compstep/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/proc/commexch/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/proc/commturn/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/proc/compexec/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/proc/termdec/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/proc/termdef/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/proc/termexp/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/proc/typedef/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/proc/typeexp/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/pool/compstep/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/pool/commexch/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/pool/commturn/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/pool/compexec/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/pool/compvar/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/pool/termdef/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/pool/termexp/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/pool/typedef/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/pool/typeexp/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/adt/compsem/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/adt/descsem/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/adt/implsem/adapter": "Core/domain code must depend on a port, not an adapter."
    "orglang/go-engine/adt/typesem/adapter": "Core/domain code must depend on a port, not an adapter."
    "github.com/orglang/go-sdk": "Keep wire-format SDK dependencies in inbound/outbound adapters."
    "github.com/jackc/pgx": "Use lib/tx contracts; keep pgx in infrastructure adapters."

ADT:
  files:
    - "**/adt/**/*.go"
    - "!**/adt/**/adapter/**/*.go"
    - "!**/*_test.go"
  listMode: Lax
  deny:
    "orglang/go-engine/adt/compsem/adapter": "Domain types must not depend on concrete adapters."
    "orglang/go-engine/adt/descsem/adapter": "Domain types must not depend on concrete adapters."
    "orglang/go-engine/adt/implsem/adapter": "Domain types must not depend on concrete adapters."
    "orglang/go-engine/adt/typesem/adapter": "Domain types must not depend on concrete adapters."
    "github.com/orglang/go-sdk": "Keep SDK mapping in adapters."
    "github.com/jackc/pgx": "Keep database drivers outside the domain."
    "github.com/huandu/go-sqlbuilder": "Keep SQL construction in persistence adapters."
