name: Upgrade

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          auto_update: true
          install: false

      - name: Upgrade Go
        run: mise upgrade --bump go

      - name: Upgrade Go version in go.mod
        run: |
          go get go@latest
          go mod tidy

      - name: Upgrade remaining mise tools
        run: mise upgrade --bump

      - name: Regenerate generated artifacts
        run: |
          mise run specs:prepare
          mise run sources:prepare

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "ci: update toolchain and regenerate artifacts"
          title: "ci: update toolchain and regenerate artifacts"
          body: |
            Automated Go and mise toolchain upgrade.

            The Go version in go.mod and module dependencies are updated alongside configured mise tools.
            Generated specs and source artifacts are refreshed with the upgraded generators.
            Dependency updates are handled separately by Dependabot.
          branch: ci/refresh-generated-artifacts
          delete-branch: true
