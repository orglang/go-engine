version: '3'

includes:
  db:
    taskfile: ./db/taskfile.yaml
    dir: ./db
  app:
    taskfile: ./app/taskfile.yaml
    dir: ./app

vars:
  # process supervisor
  PSV: shell # shell, docker

tasks:
  sources:check:
    desc: Check prepared source artifact
    cmds:
      - go get -tool -modfile=gear.mod github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 github.com/jmattheis/goverter/cmd/goverter@v1.9.3
      - go tool -modfile=gear.mod goverter gen -global 'skipCopySameType' ./...
      - go tool -modfile=gear.mod golangci-lint fmt --diff
      - go tool -modfile=gear.mod golangci-lint run ./...

  sources:prepare:
    desc: Prepare source artifact
    cmds:
      - gofmt -s -w .
      - task: sources:generate

  sources:generate:
    desc: Generate source artifacts with goverter
    cmds:
      - go get -tool -modfile=gear.mod github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 github.com/jmattheis/goverter/cmd/goverter@v1.9.3
      - go tool -modfile=gear.mod goverter gen -global 'skipCopySameType' ./...

  sources:verify:
    desc: Verify the current HEAD before publishing
    cmds:
      - task: tests:unit

  hooks:install:
    desc: Configure this repository to use versioned Git hooks
    cmds:
      - git config core.hooksPath .githooks

  process:
    aliases: [proc]
    desc: Run specified process in foreground
    cmds:
      - task: app:process

  container:
    aliases: [cnt]
    desc: Start specified container in background
    cmds:
      - cmd: container started

  processes:
    aliases: [procs]
    desc: Run and interrupt all processes
    cmds:
      - task: app:process

  tests:*:
    desc: Run tests of specified level (unit, it, e2e).
    vars:
      LEVEL: '{{index .MATCH 0}}'
    cmds:
      - cmd: go test -tags=unit ./lib/... ./adt/... ./app/... ./pool/... ./proc/...
        if: '{{eq .LEVEL "unit"}}'
      - cmd: go test -run=TestIntegration ./lib/... ./adt/... ./app/...
        if: '{{eq .LEVEL "it"}}'
      - cmd: go test -failfast ./test/...
        if: '{{eq .LEVEL "e2e"}}'

  generator:*:
    vars:
      TOOL: '{{index .MATCH 0}}'
    run: once
    cmds:
      - cmd: go get -tool -modfile=gear.mod github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 github.com/jmattheis/goverter/cmd/goverter@v1.9.3
        if: '{{eq .TOOL "goverter"}}'
