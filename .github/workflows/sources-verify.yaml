name: Sources Verify

on:
  # Keep the default-branch Go cache warm for reuse by pull request workflows.
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types:
      - opened
      - ready_for_review
      - synchronize

permissions:
  contents: read

jobs:
  sources-verify:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Check dependencies
        run: mise run deps:check

      - name: Install sources toolchain
        run: mise -E sources-dev install --locked

      - name: Check sources
        run: mise -E sources-dev exec -- task sources:check

      - name: Run unit tests
        run: mise -E binaries-dev exec -- task tests:unit
