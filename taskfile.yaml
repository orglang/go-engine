version: '3'

includes:
  db:
    taskfile: ./db/taskfile.yaml
    dir: ./db
  engine:
    taskfile: ./cmd/engine/taskfile.yaml
    dir: .

vars:
  # process supervisor
  PSV: shell # shell, docker

tasks:
  binaries:
    desc: Run integration checks and build application binaries
    cmds:
      - task: binaries:test
      - task: binaries:build

  binaries:test:
    desc: Run integration tests required for binary delivery
    cmds:
      - task: tests:it

  binaries:build:
    desc: Build application binaries
    cmds:
      - task: engine:binary

  sources:check:
    desc: Verify generated sources and run linters
    deps:
      - task: sources:generate
    cmds:
      - test -z "$(git status --porcelain -- ':(glob)**/*.gen.go' internal/pool/ent)"
      - golangci-lint fmt --diff
      - golangci-lint run ./...

  sources:prepare:
    desc: Generate source artifacts and format handwritten Go code
    cmds:
      - task: sources:generate
      - golangci-lint fmt

  sources:generate:
    desc: Generate source artifacts
    cmds:
      - goverter gen -global 'skipCopySameType' ./...
      - oapi-codegen -config internal/app/web/api/cfg.yaml openapi/openapi.yaml
      - go generate ./internal/pool/ent

  specs:generate:
    desc: Generate OpenAPI from TypeSpec
    dir: tsp
    cmds:
      - npm run build

  specs:check:
    desc: Check TypeSpec compilation and generated OpenAPI
    deps:
      - task: specs:generate
    cmds:
      - test -f openapi/openapi.yaml
      - test -z "$(git status --porcelain -- openapi/openapi.yaml)"

  specs:verify:
    desc: Verify specs before publishing
    cmds:
      - task: specs:check

  hooks:install:
    desc: Configure this repository to use versioned Git hooks
    cmds:
      - git config core.hooksPath .githooks

  process:
    aliases: [proc]
    desc: Run specified process in foreground
    cmds:
      - task: engine:process

  container:
    aliases: [cnt]
    desc: Start specified process in foreground
    cmds:
      - task: engine:process

  container:
    aliases: [cnt]
    desc: Start specified process in foreground
    cmds:
      - task: engine:process

  processes:
    aliases: [procs]
    desc: Run and interrupt all processes
    cmds:
      - task: engine:process

  tests:*:
    desc: Run tests of specified level (unit, it, e2e).
    vars:
      LEVEL: '{{index .MATCH 0}}'
    cmds:
      - cmd: go test -tags=unit ./internal/lib/... ./internal/adt/... ./internal/app/... ./cmd/... ./internal/pool/... ./internal/proc/... ./internal/prog/... ./internal/proto/...
        if: '{{eq .LEVEL "unit"}}'
      - cmd: go test -run=TestIntegration ./internal/lib/... ./internal/adt/... ./internal/app/... ./cmd/... ./test/it/...
        if: '{{eq .LEVEL "it"}}'
      - cmd: go test -failfast ./test/...
        if: '{{eq .LEVEL "e2e"}}'
