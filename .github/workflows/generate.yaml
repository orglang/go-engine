name: Generate artifacts

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Cache mise downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/mise/downloads-cas
          key: mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: false

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            gear.sum

      - name: Tidy Go modules
        run: |
          GOWORK=off go mod tidy
          GOWORK=off go mod tidy -modfile=gear.mod

      - name: Update mise lockfile
        run: mise lock

      - name: Update TypeSpec npm lockfile
        run: npm install --prefix tsp --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install TypeSpec dependencies
        run: npm ci --prefix tsp --no-audit --no-fund

      - name: Generate OpenAPI
        run: task specs:generate

      - name: Generate Go sources
        run: task sources:generate

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git diff --cached --check
          git commit -m "chore(generated): refresh artifacts [generated]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
