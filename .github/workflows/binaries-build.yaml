name: Binaries Gate

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - ready_for_review
      - synchronize
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      specs: ${{ steps.detect.outputs.specs }}
      sources: ${{ steps.detect.outputs.sources }}
      binaries: ${{ steps.detect.outputs.binaries }}
    steps:
      - name: Checkout engine
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect changed areas
        id: detect
        uses: ./.github/actions/change-detection

  binaries:
    name: Binaries Gate
    needs: detect-changes
    if: ${{ (needs.detect-changes.outputs.specs == 'true' || needs.detect-changes.outputs.sources == 'true' || needs.detect-changes.outputs.binaries == 'true') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: true
          cache_key: "{{default}}-binaries"
          install: true
          cache_save_post: true

      - name: Run binary checks
        run: mise exec -- task binaries
