name: Sources Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.app.outputs.changed }}
    steps:
      - name: Checkout workspace actions
        uses: actions/checkout@v6
        with:
          ref: main
          repository: orglang/go-workspace
          path: .ci

      - name: Detect application changes
        id: app
        uses: ./.ci/.github/actions/app-changes

  sources:
    needs: changes
    uses: orglang/go-workspace/.github/workflows/sources.yaml@main
    with:
      engine_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      sdk_ref: main
      workspace_ref: main
      run: ${{ needs.changes.outputs.run == 'true' }}
