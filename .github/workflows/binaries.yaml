name: Binaries

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    env:
      ENTPGX_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/entpgx_test?sslmode=disable
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: entpgx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d entpgx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout engine
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: true
          cache_key: "{{default}}-pipe"
          install: true
          cache_save_post: true

      - name: Run Binaries gate
        run: mise run binaries:gate
