name: Sources Check

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  sources-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check sources
        run: task sources:check

      - name: Run unit tests
        run: task tests:unit
