---
name: postgres

networks:
  orglang:
    name: orglang
    external: false

services:
  storage:
    image: postgres:17.11-alpine3.24
    networks:
      - orglang
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: $POSTGRES_ADMIN_USER
      POSTGRES_PASSWORD: $POSTGRES_ADMIN_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_ADMIN_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      image.key: orglang/postgres

  database:
    image: orglang/pg-operator:latest
    networks:
      - orglang
    depends_on:
      storage:
        condition: service_healthy
    environment:
      DBA_DSN: $DBA_DSN
      DB_NAME: $DB_NAME
      DB_SCHEMA: $DB_SCHEMA
      DB_OWNER: $DB_OWNER
      DB_OWNER_PASSWORD: $DB_OWNER_PASSWORD
    command:
      - /bin/sh
      - -ec
      - |
        psql "$$DBA_DSN" \
          -v ON_ERROR_STOP=1 \
          -v DB_NAME="$$DB_NAME" \
          -v DB_SCHEMA="$$DB_SCHEMA" \
          -v DB_OWNER="$$DB_OWNER" \
          -v DB_OWNER_PASSWORD="$$DB_OWNER_PASSWORD" \
          -f /migrations/dba/bootstrap.sql
    labels:
      image.key: orglang/postgres

  schema:
    image: orglang/pg-operator:latest
    networks:
      - orglang
    depends_on:
      database:
        condition: service_completed_successfully
    environment:
      OWNER_DSN: $OWNER_DSN
    command:
      - /bin/sh
      - -ec
      - |
        migrate \
          -source file:///migrations/owner \
          -database "$$OWNER_DSN" \
          up
    labels:
      image.key: orglang/postgres
