          func TestTypedSuccessNoContentAndUnmodeledErrorResponses(t *testing.T) {
              server := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
                  switch r.URL.Path {
                  case "/api/v1/pools/executions":
                      if r.Method != http.MethodPost {
                          t.Errorf("execution method = %q, want POST", r.Method)
                      }
                      if got := r.Header.Get("Content-Type"); got != "application/json" {
                          t.Errorf("execution Content-Type = %q, want application/json", got)
                      }
                      w.Header().Set("Content-Type", "application/json")
                      w.WriteHeader(http.StatusCreated)
                      _, _ = io.WriteString(w, `{"comp_id":"comp-created","comp_rn":12}`)
                  case "/api/v1/pools/executions/steps":
                      w.WriteHeader(http.StatusNoContent)
                  case "/api/v1/programs":
                      w.Header().Set("Content-Type", "text/plain")
                      w.WriteHeader(http.StatusUnprocessableEntity)
                      _, _ = io.WriteString(w, "invalid program")
                  default:
                      http.NotFound(w, r)
                  }
              }))
              defer server.Close()

              client, err := NewClientWithResponses(server.URL)
              if err != nil {
                  t.Fatalf("create generated client: %v", err)
              }

              created, err := client.EngineApiCreatePoolExecutionWithResponse(context.Background(), AnyExecSpec{
                  TermQn: "example.term",
                  LiabVar: AnyExecVarSpec{ConnPh: "liability", TermQn: "example.Liab"},
                  AssetVars: []AnyExecVarSpec{},
              })
              if err != nil {
                  t.Fatalf("create pool execution: %v", err)
              }
              if created.StatusCode() != http.StatusCreated {
                  t.Fatalf("creation status = %d, want 201", created.StatusCode())
              }
              if created.JSON201 == nil || created.JSON201.CompId != "comp-created" || created.JSON201.CompRn != 12 {
                  t.Fatalf("typed creation response = %+v, want comp-created revision 12", created.JSON201)
              }

              stepped, err := client.EngineApiStepPoolExecutionWithBodyWithResponse(
                  context.Background(), "application/json", strings.NewReader(`{}`),
              )
              if err != nil {
                  t.Fatalf("step pool execution: %v", err)
              }
              if stepped.StatusCode() != http.StatusNoContent || len(stepped.Body) != 0 {
                  t.Fatalf("204 response = status %d body %q, want empty 204", stepped.StatusCode(), stepped.Body)
              }

              rejected, err := client.EngineApiCreateProgramWithTextBodyWithResponse(
                  context.Background(), "invalid source",
              )
              if err != nil {
                  t.Fatalf("create invalid program: %v", err)
              }
              if rejected.StatusCode() != http.StatusUnprocessableEntity || string(rejected.Body) != "invalid program" {
                  t.Fatalf("unmodeled error response = status %d body %q, want 422 and raw body",
                      rejected.StatusCode(), rejected.Body)
              }
          }


          
          type roundTripperFunc func(*http.Request) (*http.Response, error)

          func (fn roundTripperFunc) RoundTrip(req *http.Request) (*http.Response, error) {
              return fn(req)
          }

          func TestCustomHTTPTransportAndRequestEditor(t *testing.T) {
              var transportCalled bool
              httpClient := &http.Client{
                  Transport: roundTripperFunc(func(req *http.Request) (*http.Response, error) {
                      transportCalled = true
                      if got := req.Header.Get("X-Client-Test"); got != "editor-value" {
                          t.Fatalf("request editor header = %q, want editor-value", got)
                      }
                      if req.URL.Host != "api.example.test" {
                          t.Fatalf("request host = %q, want api.example.test", req.URL.Host)
                      }
                      return &http.Response{
                          StatusCode: http.StatusCreated,
                          Status: "201 Created",
                          Header: http.Header{"Content-Type": []string{"application/json"}},
                          Body: io.NopCloser(strings.NewReader(`{"comp_id":"custom-transport","comp_rn":5}`)),
                          Request: req,
                      }, nil
                  }),
              }
              client, err := NewClientWithResponses(
                  "https://api.example.test",
                  WithHTTPClient(httpClient),
                  WithRequestEditorFn(func(ctx context.Context, req *http.Request) error {
                      req.Header.Set("X-Client-Test", "editor-value")
                      return nil
                  }),
              )
              if err != nil {
                  t.Fatalf("create client with custom transport: %v", err)
              }
              response, err := client.EngineApiCreatePoolExecutionWithResponse(
                  context.Background(),
                  AnyExecSpec{
                      TermQn: "example.term",
                      LiabVar: AnyExecVarSpec{ConnPh: "liability", TermQn: "example.Liab"},
                      AssetVars: []AnyExecVarSpec{},
                  },
              )
              if err != nil {
                  t.Fatalf("request through custom transport: %v", err)
              }
              if !transportCalled {
                  t.Fatal("custom HTTP transport was not called")
              }
              if response.StatusCode() != http.StatusCreated ||
                  response.JSON201 == nil || response.JSON201.CompId != "custom-transport" {
                  t.Fatalf("custom transport response = status %d, body %+v", response.StatusCode(), response.JSON201)
              }
          }

          func TestRequestContextCancellationPropagates(t *testing.T) {
              transport := roundTripperFunc(func(req *http.Request) (*http.Response, error) {
                  <-req.Context().Done()
                  return nil, req.Context().Err()
              })
              client, err := NewClientWithResponses(
                  "https://api.example.test",
                  WithHTTPClient(&http.Client{Transport: transport}),
              )
              if err != nil {
                  t.Fatalf("create client: %v", err)
              }
              ctx, cancel := context.WithCancel(context.Background())
              cancel()
              _, err = client.EngineApiCreatePoolExecutionWithResponse(
                  ctx,
                  AnyExecSpec{
                      TermQn: "example.term",
                      LiabVar: AnyExecVarSpec{ConnPh: "liability", TermQn: "example.Liab"},
                      AssetVars: []AnyExecVarSpec{},
                  },
              )
              if !errors.Is(err, context.Canceled) {
                  t.Fatalf("request error = %v, want context.Canceled", err)
              }
          }



          func TestRequestEditorErrorPreventsTransportAndPropagates(t *testing.T) {
              editorErr := errors.New("request editor failed")
              transportCalled := false
              client, err := NewClientWithResponses(
                  "https://api.example.test",
                  WithHTTPClient(&http.Client{Transport: roundTripperFunc(func(req *http.Request) (*http.Response, error) {
                      transportCalled = true
                      return nil, errors.New("transport should not be called")
                  })}),
                  WithRequestEditorFn(func(ctx context.Context, req *http.Request) error {
                      return editorErr
                  }),
              )
              if err != nil {
                  t.Fatalf("create client: %v", err)
              }
              _, err = client.EngineApiCreatePoolExecutionWithResponse(
                  context.Background(),
                  AnyExecSpec{
                      TermQn: "example.term",
                      LiabVar: AnyExecVarSpec{ConnPh: "liability", TermQn: "example.Liab"},
                      AssetVars: []AnyExecVarSpec{},
                  },
              )
              if !errors.Is(err, editorErr) {
                  t.Fatalf("request error = %v, want wrapped editor error", err)
              }
              if transportCalled {
                  t.Fatal("transport was called after request editor failed")
              }
          }

