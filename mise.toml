[settings]
lockfile = true
experimental = true

[tools]
go = "1.27.0"
"go:github.com/go-task/task/v3/cmd/task" = "v3.54.0"

[tasks."deps:install"]
description = "Install TypeSpec dependencies"
tools = { node = "26.10.0" }
run = "npm ci --prefix tsp --no-audit --no-fund"
sources = ["tsp/package.json", "tsp/package-lock.json"]
outputs = ["tsp/node_modules"]

[task_config.input_groups]
common = [
  ".github/**",
  "taskfile.yaml",
  "**/taskfile.yaml",
  "mise.lock",
  ".miserc.toml",
]
specs = [
  "tsp/**",
  "openapi/openapi.yaml",
  "mise.specs-dev.toml",
  "mise.specs-dev.lock",
]
sources = [
  "*.go",
  "**/*.go",
  "mise.sources-dev.toml",
  "mise.sources-dev.lock",
  ".golangci.yml",
  "staticcheck.conf",
]
binaries = [
  "*.sql",
  "**/*.sql",
  "go.mod",
  "go.sum",
  "**/go.mod",
  "**/go.sum",
]

[tasks."specs:gate"]
description = "Check generated Specs and their inputs"
tools = { node = "26.10.0" }
depends = ["deps:install"]
run = "task specs:gate"
sources = ["@group:common", "@group:specs"]
outputs = []

[tasks."specs:lint"]
description = "Lint Specs without modifying files"
tools = { node = "26.10.0" }
depends = ["deps:install"]
run = "task specs:lint"
sources = ["@group:specs"]
outputs = []

[tasks."specs:analyze"]
description = "Analyze Specs without emitting generated outputs"
tools = { node = "26.10.0" }
depends = ["deps:install"]
run = "task specs:analyze"
sources = ["@group:specs"]
outputs = []

[tasks."sources:gate"]
description = "Verify generated Sources and lockfiles"
depends = ["specs:gate"]
tools = {
  "go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "v2.15.0",
  "go:github.com/jmattheis/goverter/cmd/goverter" = "v1.11.1",
  "go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "v2.8.2",
}
run = "task sources:gate"
sources = ["@group:sources"]
outputs = []

[tasks."sources:lint"]
description = "Lint Sources without modifying files"
depends = ["specs:gate"]
tools = {
  "go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "v2.15.0",
  "go:github.com/jmattheis/goverter/cmd/goverter" = "v1.11.1",
  "go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "v2.8.2",
}
run = "task sources:lint"
sources = ["@group:sources"]
outputs = []

[tasks."sources:analyze"]
description = "Run static and architecture analysis on Sources"
depends = ["specs:gate"]
tools = {
  "go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "v2.15.0",
  "go:github.com/jmattheis/goverter/cmd/goverter" = "v1.11.1",
  "go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "v2.8.2",
}
run = "task sources:analyze"
sources = ["@group:sources"]
outputs = []

[tasks."binaries:gate"]
description = "Run Specs, Sources, then Binaries delivery checks"
depends = ["sources:gate"]
run = "task binaries:gate"
sources = ["@group:binaries"]
outputs = []
