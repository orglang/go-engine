name: Sources Check

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]
    types:
      - opened
      - ready_for_review
      - synchronize

permissions:
  contents: read

jobs:
  sources-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            gear.mod
            gear.sum

      - name: Check sources
        run: GOWORK=off go tool -modfile=gear.mod task sources:check

      - name: Run unit tests
        run: GOWORK=off go tool -modfile=gear.mod task tests:unit
