name: Distros

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions evaluates cron schedules in UTC; avoid the top-of-hour
    # scheduling peak by running daily at 03:42 UTC.
    - cron: '42 3 * * *'
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  merge_group:
    branches: [main]
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v7
        with:
          repository: orglang/go-workspace
          ref: 25b77d529c40ba1632582d61418b9f22d9b82750
          fetch-depth: 0

      - name: Checkout engine
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          repository: orglang/go-engine
          path: engine
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: true
          cache_key: "{{default}}-distros-${{ hashFiles('mise.toml', 'mise.lock', 'engine/mise*.toml', 'engine/mise*.lock') }}"
          install: true
          cache_save_post: true

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.39.0

      - name: Expose GitHub runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Run Distros gate
        run: mise run //:distros:gate commons

      - name: PostgreSQL logs
        if: ${{ failure() }}
        working-directory: stack
        run: >-
          docker compose
          -f ops/postgres.compose.yaml
          -f ops/engine.compose.yaml
          --env-file ops/commons/.env
          logs --no-color || true
