name: Sources Verify

on:
  # Keep the default-branch Go cache warm for reuse by pull request workflows.
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types:
      - opened
      - ready_for_review
      - synchronize
  # Publish a successful skipped job for merge-queue entries. The full
  # verification remains a pull-request check and is not repeated here.
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  sources-verify:
    if: github.event_name != 'merge_group' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: true
          install: true
          # Defer saving until later environment-specific installs have populated the cache.
          cache_save_post: true

      - name: Install specs and sources toolchains
        run: |
          mise -E specs install --locked
          mise -E sources install --locked

      - name: Check dependencies
        run: mise run deps:check

      - name: Check sources
        run: mise -E sources exec -- task sources:check

      - name: Run unit tests
        run: mise exec -- task tests:unit
