name: Distros Workflow

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - ready_for_review
      - synchronize
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distros:
    uses: orglang/go-workspace/.github/workflows/distros.yaml@b2c1ce7f6b2457e6808d6e15af5e652341b99f80
    with:
      engine_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      sdk_ref: main
      workspace_ref: 4a2ad65b2831f6965b0f9d89c85c29b8cc0e44f7
      run: true
