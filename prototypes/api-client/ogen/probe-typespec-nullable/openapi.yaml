openapi: 3.1.0
info:
  title: Required nullable recursive TypeSpec probe
  version: 0.0.0
tags: []
paths:
  /probe:
    get:
      operationId: probe
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A'
components:
  schemas:
    A:
      type: object
      required:
        - b
      properties:
        b:
          $ref: '#/components/schemas/B'
    B:
      type: object
      required:
        - a
      properties:
        a:
          anyOf:
            - $ref: '#/components/schemas/A'
            - type: 'null'
