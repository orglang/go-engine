name: Distros

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  merge_group:
    branches: [main]
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v7
        with:
          repository: orglang/go-workspace
          ref: ci/distros-gate-task
          fetch-depth: 0

      - name: Checkout engine
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          repository: orglang/go-engine
          path: engine
          fetch-depth: 0

      - name: Checkout SDK
        uses: actions/checkout@v7
        with:
          ref: main
          repository: orglang/go-sdk
          path: sdk

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: true
          cache_key: "{{default}}-distros-${{ hashFiles('mise.toml', 'mise.lock', 'engine/mise*.toml', 'engine/mise*.lock') }}"
          install: true
          cache_save_post: true

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.39.0

      - name: Expose GitHub runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Run Distros gate
        run: mise run //:distros:gate

      - name: PostgreSQL logs
        if: ${{ failure() }}
        working-directory: stack
        run: >-
          docker compose
          -f ops/postgres.compose.yaml
          -f ops/engine.compose.yaml
          --env-file ops/commons/.env
          logs --no-color || true
