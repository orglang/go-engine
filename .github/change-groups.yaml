# Classify changed inputs by pipeline stage. Downstream impact is documented
# separately in .github/change-detection.md.

app-specs:
  - 'tsp/*.tsp'
  - 'tsp/**/*.tsp'
  - 'openapi/openapi.yaml'

tool-specs:
  - 'tsp/tspconfig.yaml'
  - 'tsp/package.json'
  - 'tsp/package-lock.json'

app-sources:
  - '**/*.go'
  - '**/*.sql'
  - '*.go'
  - '*.sql'
  - 'go.mod'
  - 'go.sum'
  - '**/go.mod'
  - '**/go.sum'

tool-sources:
  - 'scripts/**/*.py'
  - 'scripts/*.py'
  - 'scripts/**/*.sh'
  - 'scripts/*.sh'
  - '*.sh'
  - '**/*.sh'

app-binaries:
  - 'cmd/engine/**'

tool-binaries: []

app-distros:
  - 'Dockerfile'
  - 'Dockerfile.*'
  - '**/Dockerfile'
  - '**/Dockerfile.*'
  - '*.Dockerfile'
  - '**/*.Dockerfile'
  - '.dockerignore'
  - 'compose.yaml'
  - 'compose.yml'
  - '*.compose.yaml'
  - '*.compose.yml'
  - '**/compose.yaml'
  - '**/compose.yml'
  - '**/*.compose.yaml'
  - '**/*.compose.yml'

tool-distros:
  - 'mise.distros.toml'
  - 'mise.distros.lock'

ci-config:
  - '.github/workflows/**'
  - '.github/actions/**'
  - '.github/change-groups.yaml'

task-config:
  - 'taskfile.yaml'
  - '**/taskfile.yaml'

toolchain-config:
  - 'mise*.toml'
  - 'mise*.lock'
  - '.miserc.toml'
  - '**/mise*.toml'
  - '**/mise*.lock'
