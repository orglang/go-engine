version: "2"

linters:
  default: none
  enable:
    - depguard
  settings:
    depguard:
      rules:
        core-boundaries:
          list-mode: lax
          files:
            - "**/core/**/*.go"
            - "**/domain/**/*.go"
          deny:
            - pkg: "orglang/go-engine/pool/commexch/adapter"
              desc: "Core and domain packages must not depend on concrete adapters; depend on a port instead."
            - pkg: "orglang/go-engine/pool/commturn/adapter"
              desc: "Core and domain packages must not depend on concrete adapters; depend on a port instead."
            - pkg: "orglang/go-engine/pool/compexec/adapter"
              desc: "Core and domain packages must not depend on concrete adapters; depend on a port instead."
            - pkg: "orglang/go-engine/pool/compstep/adapter"
              desc: "Core and domain packages must not depend on concrete adapters; depend on a port instead."
            - pkg: "orglang/go-engine/pool/compvar/adapter"
              desc: "Core and domain packages must not depend on concrete adapters; depend on a port instead."
            - pkg: "orglang/go-engine/pool/termdef/adapter"
              desc: "Core and domain packages must not depend on concrete adapters; depend on a port instead."
            - pkg: "orglang/go-engine/pool/termexp/adapter"
              desc: "Core and domain packages must not depend on concrete adapters; depend on a port instead."
            - pkg: "orglang/go-engine/pool/typedef/adapter"
              desc: "Core and domain packages must not depend on concrete adapters; depend on a port instead."
            - pkg: "orglang/go-engine/pool/typeexp/adapter"
              desc: "Core and domain packages must not depend on concrete adapters; depend on a port instead."
            - pkg: "orglang/go-engine/proc/commexch/adapter"
              desc: "Core and domain packages must not depend on concrete adapters; depend on a port instead."
            - pkg: "orglang/go-engine/proc/commturn/adapter"
              desc: "Core and domain packages must not depend on concrete adapters; depend on a port instead."
            - pkg: "orglang/go-engine/proc/compexec/adapter"
              desc: "Core and domain packages must not depend on concrete adapters; depend on a port instead."
            - pkg: "orglang/go-engine/proc/compstep/adapter"
              desc: "Core and domain packages must not depend on concrete adapters; depend on a port instead."
            - pkg: "orglang/go-engine/proc/termdec/adapter"
              desc: "Core and domain packages must not depend on concrete adapters; depend on a port instead."
            - pkg: "orglang/go-engine/proc/termdef/adapter"
              desc: "Core and domain packages must not depend on concrete adapters; depend on a port instead."
            - pkg: "orglang/go-engine/proc/termexp/adapter"
              desc: "Core and domain packages must not depend on concrete adapters; depend on a port instead."
            - pkg: "orglang/go-engine/proc/typedef/adapter"
              desc: "Core and domain packages must not depend on concrete adapters; depend on a port instead."
            - pkg: "orglang/go-engine/proc/typeexp/adapter"
              desc: "Core and domain packages must not depend on concrete adapters; depend on a port instead."
            - pkg: "orglang/go-engine/prog/adapter"
              desc: "Core and domain packages must not depend on concrete adapters; depend on a port instead."
            - pkg: "github.com/orglang/go-sdk"
              desc: "Core and domain packages must not depend on the wire-format SDK."
