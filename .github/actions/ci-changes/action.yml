name: Detect CI changes
description: Classify changed paths into app/tool dependency and artifact groups.

outputs:
  app-deps:
    description: Application dependency inputs changed.
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs['app-deps'] == 'true' }}
  tool-deps:
    description: Tool dependency inputs changed.
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs['tool-deps'] == 'true' }}
  app-specs:
    description: Application specification inputs changed.
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs['app-specs'] == 'true' }}
  tool-specs:
    description: Specification tooling inputs changed.
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs['tool-specs'] == 'true' }}
  app-sources:
    description: Application source inputs changed.
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs['app-sources'] == 'true' }}
  tool-sources:
    description: Source-generation and task tooling inputs changed.
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs['tool-sources'] == 'true' }}
  app-binaries:
    description: Application binary-specific inputs changed.
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs['app-binaries'] == 'true' }}
  tool-binaries:
    description: Binary workflow/tooling inputs changed.
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs['tool-binaries'] == 'true' }}
  app-distros:
    description: Application distribution inputs changed.
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs['app-distros'] == 'true' }}
  tool-distros:
    description: Distribution workflow/tooling inputs changed.
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs['tool-distros'] == 'true' }}

runs:
  using: composite
  steps:
    - name: Detect pull request changes
      id: filter
      if: ${{ github.event_name == 'pull_request' }}
      uses: dorny/paths-filter@v4
      with:
        filters: .github/ci-paths.yaml
