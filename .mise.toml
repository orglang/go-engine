# Prototype validation includes non-nullable and nullable required-recursion fixtures.
[tools]
node = "22"

[tasks.generate]
description = "Generate temporary API client generator prototypes"
run = "mise run generate:api-client-prototypes"

[tasks."generate:api-client-prototypes"]
description = "Verify ogen v1.25.0 recursion patch, generated models, and compilation"
run = [
  "GOWORK=off go mod download github.com/ogen-go/ogen@v1.25.0",
  'ogen_dir="$(go env GOPATH)/pkg/mod/github.com/ogen-go/ogen@v1.25.0" && chmod -R u+w "$ogen_dir/gen/ir" "$ogen_dir/gen" && ((grep -q "Optional fields are represented through pointers." "$ogen_dir/gen/ir/recursion.go" && grep -q "Required recursive fields need a pointer" "$ogen_dir/gen/generics.go") || (patch -d "$ogen_dir" -p1 < prototypes/api-client/ogen/patches/0001-ignore-optional-recursion-edges.patch || true) && grep -q "Optional fields are represented through pointers." "$ogen_dir/gen/ir/recursion.go" && grep -q "Required recursive fields need a pointer" "$ogen_dir/gen/generics.go")',

  "mkdir -p prototypes/api-client/ogen prototypes/api-client/oapi-codegen",
  "node tsp/scripts/normalize-openapi-for-ogen.mjs openapi/openapi.yaml /tmp/openapi-ogen.yaml",
  "cd tsp && npx tsp compile probes/required-nullable-cycle",
  "if GOMODCACHE=/tmp/ogen-v1.25.0-unpatched-gomodcache GOWORK=off go run github.com/ogen-go/ogen/cmd/ogen@v1.25.0 --target prototypes/api-client/ogen/probe-typespec-nullable-unpatched-client --package probe --clean prototypes/api-client/ogen/probe-typespec-nullable/openapi.yaml > prototypes/api-client/ogen/probe-typespec-nullable-unpatched.log 2>&1; then echo 0 > prototypes/api-client/ogen/probe-typespec-nullable-unpatched.exit-code; else echo $? > prototypes/api-client/ogen/probe-typespec-nullable-unpatched.exit-code; fi",
  "if GOWORK=off go run github.com/ogen-go/ogen/cmd/ogen@v1.25.0 --target prototypes/api-client/ogen/probe-typespec-nullable-client --package probe --clean prototypes/api-client/ogen/probe-typespec-nullable/openapi.yaml > prototypes/api-client/ogen/probe-typespec-nullable.log 2>&1; then echo 0 > prototypes/api-client/ogen/probe-typespec-nullable.exit-code; else echo $? > prototypes/api-client/ogen/probe-typespec-nullable.exit-code; fi",
  "test \"$(cat prototypes/api-client/ogen/probe-typespec-nullable-unpatched.exit-code)\" -eq 0",
  "test \"$(cat prototypes/api-client/ogen/probe-typespec-nullable.exit-code)\" -eq 0",
  "(chmod -R u+w /tmp/ogen-v1.25.0-unpatched-gomodcache /tmp/ogen-v1.25.0-unpatched 2>/dev/null || true) && rm -rf /tmp/ogen-v1.25.0-unpatched-gomodcache /tmp/ogen-v1.25.0-unpatched && if GOMODCACHE=/tmp/ogen-v1.25.0-unpatched-gomodcache GOWORK=off go run github.com/ogen-go/ogen/cmd/ogen@v1.25.0 --target /tmp/ogen-v1.25.0-unpatched --package probe --clean /tmp/openapi-ogen.yaml > /tmp/ogen-v1.25.0-unpatched.log 2>&1; then echo 'ERROR: ogen v1.25.0 unexpectedly generated the contract without the local patch'; cat /tmp/ogen-v1.25.0-unpatched.log; exit 1; else grep -q 'infinite recursion' /tmp/ogen-v1.25.0-unpatched.log || { cat /tmp/ogen-v1.25.0-unpatched.log; echo 'ERROR: unpatched ogen failed for a reason other than recursive required fields'; exit 1; }; echo 'Confirmed: unpatched ogen v1.25.0 fails on required recursive fields'; fi",
  "if GOWORK=off go run github.com/ogen-go/ogen/cmd/ogen@v1.25.0 --config prototypes/api-client/ogen.yml --target prototypes/api-client/ogen --package ogenclient --clean /tmp/openapi-ogen.yaml > prototypes/api-client/ogen/generate.log 2>&1; then echo 0 > prototypes/api-client/ogen/exit-code; else echo $? > prototypes/api-client/ogen/exit-code; fi",
  "if GOWORK=off go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.2 -generate types,client -package oapiclient openapi/openapi.yaml > prototypes/api-client/oapi-codegen/client.go 2> prototypes/api-client/oapi-codegen/generate.log; then echo 0 > prototypes/api-client/oapi-codegen/exit-code; else echo $? > prototypes/api-client/oapi-codegen/exit-code; fi",
  "mkdir -p prototypes/api-client/ogen/probe-optional prototypes/api-client/ogen/probe-required prototypes/api-client/ogen/probe-nullable",
  "if GOWORK=off go run github.com/ogen-go/ogen/cmd/ogen@v1.25.0 --target prototypes/api-client/ogen/probe-optional --package probe --clean prototypes/api-client/ogen/fixtures/optional-cycle.yaml > prototypes/api-client/ogen/probe-optional.log 2>&1; then echo 0 > prototypes/api-client/ogen/probe-optional.exit-code; else echo $? > prototypes/api-client/ogen/probe-optional.exit-code; fi",
  "if GOWORK=off go run github.com/ogen-go/ogen/cmd/ogen@v1.25.0 --target prototypes/api-client/ogen/probe-required --package probe --clean prototypes/api-client/ogen/fixtures/required-cycle.yaml > prototypes/api-client/ogen/probe-required.log 2>&1; then echo 0 > prototypes/api-client/ogen/probe-required.exit-code; else echo $? > prototypes/api-client/ogen/probe-required.exit-code; fi",
  "if GOMODCACHE=/tmp/ogen-v1.25.0-unpatched-gomodcache GOWORK=off go run github.com/ogen-go/ogen/cmd/ogen@v1.25.0 --target /tmp/ogen-v1.25.0-unpatched-nullable --package probe --clean prototypes/api-client/ogen/fixtures/required-nullable-cycle.yaml > prototypes/api-client/ogen/probe-nullable-unpatched.log 2>&1; then echo 0 > prototypes/api-client/ogen/probe-nullable-unpatched.exit-code; else echo $? > prototypes/api-client/ogen/probe-nullable-unpatched.exit-code; fi",
  "if GOWORK=off go run github.com/ogen-go/ogen/cmd/ogen@v1.25.0 --target prototypes/api-client/ogen/probe-nullable --package probe --clean prototypes/api-client/ogen/fixtures/required-nullable-cycle.yaml > prototypes/api-client/ogen/probe-nullable.log 2>&1; then echo 0 > prototypes/api-client/ogen/probe-nullable.exit-code; else echo $? > prototypes/api-client/ogen/probe-nullable.exit-code; fi",
  "printf 'optional-edge exit=%s\\nrequired-edge exit=%s\\nnullable-unpatched exit=%s\\nnullable-patched exit=%s\\n' \"$(cat prototypes/api-client/ogen/probe-optional.exit-code)\" \"$(cat prototypes/api-client/ogen/probe-required.exit-code)\" \"$(cat prototypes/api-client/ogen/probe-nullable-unpatched.exit-code)\" \"$(cat prototypes/api-client/ogen/probe-nullable.exit-code)\" > prototypes/api-client/ogen/probe-summary.txt",
  "test \"$(cat prototypes/api-client/ogen/exit-code)\" -eq 0",
  "test \"$(cat prototypes/api-client/ogen/probe-optional.exit-code)\" -eq 0",
  "test \"$(cat prototypes/api-client/ogen/probe-required.exit-code)\" -eq 0",
  "test \"$(cat prototypes/api-client/ogen/probe-nullable-unpatched.exit-code)\" -eq 0",
  "test \"$(cat prototypes/api-client/ogen/probe-nullable.exit-code)\" -eq 0",
  "cp go.mod /tmp/ogen-probe.mod && cp go.sum /tmp/ogen-probe.sum && go mod edit -modfile=/tmp/ogen-probe.mod -require=github.com/ogen-go/ogen@v1.25.0 && GOWORK=off go test -mod=mod -modfile=/tmp/ogen-probe.mod ./prototypes/api-client/ogen/probe-nullable",
  "cp prototypes/api-client/ogen/fixtures/required-nullable-runtime_test.go prototypes/api-client/ogen/probe-typespec-nullable-client/required_nullable_runtime_test.go",
  "cp prototypes/api-client/ogen/fixtures/required-nullable-runtime_test.go prototypes/api-client/ogen/probe-typespec-nullable-unpatched-client/required_nullable_runtime_test.go",
  "GOWORK=off go test -mod=mod -modfile=/tmp/ogen-probe.mod ./prototypes/api-client/ogen/probe-typespec-nullable-unpatched-client",
  "GOWORK=off go test -mod=mod -modfile=/tmp/ogen-probe.mod ./prototypes/api-client/ogen/probe-typespec-nullable-client",
  "cp go.mod /tmp/ogen-prototype.mod && cp go.sum /tmp/ogen-prototype.sum && go mod edit -modfile=/tmp/ogen-prototype.mod -require=github.com/ogen-go/ogen@v1.25.0 && GOWORK=off go test -mod=mod -modfile=/tmp/ogen-prototype.mod ./prototypes/api-client/ogen ./prototypes/api-client/ogen-test ./prototypes/api-client/pool ./prototypes/api-client/process ./prototypes/api-client/program",
  "test \"$(cat prototypes/api-client/oapi-codegen/exit-code)\" -eq 0",
]
