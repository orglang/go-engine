name: Generate artifacts

on:
  push:
    branches: [chore/api-sources-generation]
  workflow_dispatch:

permissions: {}

concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Cache mise
        uses: actions/cache@v6
        with:
          path: ~/.cache/mise
          key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: false

      - name: Lock dependencies
        run: mise run deps:lock

      - name: Install dependencies
        run: mise run deps:install

      - name: Generate OpenAPI
        run: task specs:generate

      - name: Generate Go sources
        run: task sources:generate

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git diff --cached --check
          git commit -m "chore(generated): refresh artifacts [generated]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
