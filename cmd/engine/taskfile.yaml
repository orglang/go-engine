version: '3'

vars:
  CID:
    sh: >-
      find internal/lib internal/adt internal/app internal/pool internal/proc internal/prog internal/proto cmd/engine
      -name "*.go" -exec md5sum {} + -o
      -name "Dockerfile" -exec md5sum {} +
      | LC_ALL=C sort -k 2
      | md5sum
      | head -c 7

tasks:
  binary:
    aliases: [bin]
    cmds:
      - cmd: go build -o app/engine ./cmd/engine

  process:
    aliases: [proc]
    cmds:
      - cmd: go run github.com/jmattheis/goverter/cmd/goverter gen -global 'skipCopySameType' ./...
      - cmd: go run ./cmd/engine
