name: Sources Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    uses: orglang/go-workspace/.github/workflows/sources.yaml@main
    with:
      engine_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      sdk_ref: main
      workspace_ref: main
