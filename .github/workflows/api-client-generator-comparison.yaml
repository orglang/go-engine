name: API client generator comparison

on:
  pull_request:
    paths:
      - "openapi/**"
      - "prototypes/api-client/generator-comparison/**"
      - ".github/workflows/api-client-generator-comparison.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: false
      - name: Record input checksum
        run: sha256sum openapi/openapi.yaml | tee "$RUNNER_TEMP/openapi.sha256"
      - name: Generate with ogen v1.25.0 (baseline)
        id: ogen
        shell: bash
        run: |
          set +e
          go run github.com/ogen-go/ogen/cmd/ogen@v1.25.0 \
            --target "$RUNNER_TEMP/ogen" -package api --clean openapi/openapi.yaml \
            > "$RUNNER_TEMP/ogen.log" 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/ogen.log"
          # A failure is currently expected: required recursive schemas are a known
          # blocker in the unmodified pinned ogen release. Preserve the log as evidence.
      - name: Diagnose recursive Pool.Term.ExprSpec edges
        id: ogen_recursion_diagnostic
        shell: bash
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          spec = yaml.safe_load(Path("openapi/openapi.yaml").read_text())
          included_paths = {
              "/api/v1/pools/executions/spawns",
              "/api/v1/pools/executions/steps",
          }
          spec["paths"] = {
              path: operations
              for path, operations in spec["paths"].items()
              if path in included_paths
          }

          targets = {
              "Pool.Term.HireSpec",
              "Pool.Term.ApplySpec",
              "Pool.Term.AcquireSpec",
              "Pool.Term.AcceptSpec",
          }
          schemas = spec.get("components", {}).get("schemas", {})
          for name in targets:
              schema = schemas.get(name)
              if schema is None:
                  raise SystemExit(f"missing expected schema: {name}")
              schema.get("properties", {}).pop("cont_expr", None)
              required = schema.get("required", [])
              schema["required"] = [field for field in required if field != "cont_expr"]

          Path(os.environ["RUNNER_TEMP"], "openapi-no-recursion.yaml").write_text(
              yaml.safe_dump(spec, sort_keys=False)
          )
          PY
          set +e
          go run github.com/ogen-go/ogen/cmd/ogen@v1.25.0 \
            --target "$RUNNER_TEMP/ogen-no-recursion" -package api --clean "$RUNNER_TEMP/openapi-no-recursion.yaml" \
            > "$RUNNER_TEMP/ogen-no-recursion.log" 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          printf "exit_code=%s\\n" "$status" | tee "$RUNNER_TEMP/ogen-no-recursion.exit"
          cat "$RUNNER_TEMP/ogen-no-recursion.log"
      - name: Test generated ogen package
        working-directory: ${{ runner.temp }}
        run: |
          go mod init example.com/ogen-recursion-diagnostic
          go get ./ogen-no-recursion
          go test ./ogen-no-recursion/...
      - name: Generate with oapi-codegen v2.8.2
        run: |
          mkdir -p "$RUNNER_TEMP/oapi-codegen"
          sed "s|output: client.gen.go|output: $RUNNER_TEMP/oapi-codegen/client.gen.go|" \
            prototypes/api-client/generator-comparison/oapi-codegen.yaml \
            > "$RUNNER_TEMP/oapi-codegen.yaml"
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.2 \
            -config "$RUNNER_TEMP/oapi-codegen.yaml" openapi/openapi.yaml
      - name: Add deterministic oapi-codegen JSON contract tests
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/oapi-codegen/client_contract_test.go" <<'GO'
          package api

          import (
              "encoding/json"
              "testing"
          )

          func TestPoolTermHireRecursiveJSONRoundTrip(t *testing.T) {
              input := []byte(`{"conn_ph":"hire-channel","proc_qn":"example.proc","cont_expr":{"kind":"fire","conn_ph":"fire-channel"}}`)
              var got PoolTermHireSpec
              if err := json.Unmarshal(input, &got); err != nil {
                  t.Fatalf("unmarshal hire term: %v", err)
              }

              kind, err := got.ContExpr.Discriminator()
              if err != nil {
                  t.Fatalf("read continuation discriminator: %v", err)
              }
              if kind != "fire" {
                  t.Fatalf("continuation kind = %q, want fire", kind)
              }

              encoded, err := json.Marshal(got)
              if err != nil {
                  t.Fatalf("marshal hire term: %v", err)
              }
              var wire struct {
                  ContExpr json.RawMessage `json:"cont_expr"`
              }
              if err := json.Unmarshal(encoded, &wire); err != nil {
                  t.Fatalf("decode marshaled hire term: %v", err)
              }
              var continuation map[string]json.RawMessage
              if err := json.Unmarshal(wire.ContExpr, &continuation); err != nil {
                  t.Fatalf("decode marshaled continuation: %v", err)
              }
              var roundTripKind string
              if err := json.Unmarshal(continuation["kind"], &roundTripKind); err != nil {
                  t.Fatalf("decode continuation kind: %v", err)
              }
              if roundTripKind != "fire" {
                  t.Fatalf("round-trip continuation kind = %q, want fire", roundTripKind)
              }
          }

          func TestPoolTermHireMissingRequiredContinuationIsNotValidated(t *testing.T) {
              // oapi-codegen generates ordinary encoding/json model structs; decoding
              // alone does not enforce OpenAPI required-property presence.
              var got PoolTermHireSpec
              if err := json.Unmarshal([]byte(`{"conn_ph":"hire-channel","proc_qn":"example.proc"}`), &got); err != nil {
                  t.Fatalf("unmarshal model without cont_expr: %v", err)
              }
              kind, err := got.ContExpr.Discriminator()
              if err != nil {
                  t.Fatalf("read zero-value continuation discriminator: %v", err)
              }
              if kind != "" {
                  t.Fatalf("zero-value continuation kind = %q, want empty", kind)
              }
          }
          GO
      - name: Test generated oapi-codegen package
        working-directory: ${{ runner.temp }}
        run: |
          go get ./oapi-codegen
          go test ./oapi-codegen/...
      - name: Record generated output sizes
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/comparison"
          cp "$RUNNER_TEMP/openapi.sha256" "$RUNNER_TEMP/comparison/"
          cp "$RUNNER_TEMP/ogen.log" "$RUNNER_TEMP/comparison/" || true
          cp "$RUNNER_TEMP/ogen-no-recursion.log" "$RUNNER_TEMP/comparison/" || true
          cp "$RUNNER_TEMP/ogen-no-recursion.exit" "$RUNNER_TEMP/comparison/" || true
          cp "$RUNNER_TEMP/openapi-no-recursion.yaml" "$RUNNER_TEMP/comparison/" || true
          if [ -d "$RUNNER_TEMP/ogen-no-recursion" ]; then
            du -sb "$RUNNER_TEMP/ogen-no-recursion" | tee "$RUNNER_TEMP/comparison/ogen-no-recursion-size.txt"
            cp -R "$RUNNER_TEMP/ogen-no-recursion" "$RUNNER_TEMP/comparison/ogen-no-recursion"
          fi
          if [ -d "$RUNNER_TEMP/ogen" ]; then
            du -sb "$RUNNER_TEMP/ogen" | tee "$RUNNER_TEMP/comparison/ogen-size.txt"
            cp -R "$RUNNER_TEMP/ogen" "$RUNNER_TEMP/comparison/ogen"
          fi
          if [ -d "$RUNNER_TEMP/oapi-codegen" ]; then
            du -sb "$RUNNER_TEMP/oapi-codegen" | tee "$RUNNER_TEMP/comparison/oapi-codegen-size.txt"
            cp -R "$RUNNER_TEMP/oapi-codegen" "$RUNNER_TEMP/comparison/oapi-codegen"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-client-generator-comparison
          path: ${{ runner.temp }}/comparison/
          if-no-files-found: error
