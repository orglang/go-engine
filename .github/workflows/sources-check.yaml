name: Sources Check

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  sources-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          echo "Unformatted files:"
          gofmt -s -l .
          test -z "$(gofmt -s -l .)"

      - name: Download tooling dependencies
        run: go get -tool -modfile=gear.mod github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 github.com/jmattheis/goverter@v1.9.3 github.com/quasilyte/go-consistent@v0.6.2

      - name: Run linters
        run: |
          go tool -modfile=gear.mod golangci-lint run ./...
          go tool -modfile=gear.mod go-consistent ./lib/... ./adt/... ./app/...

      - name: Generate source artifacts
        run: go tool -modfile=gear.mod goverter gen -global 'skipCopySameType' ./...

      - name: Run unit tests
        run: go test -tags=unit ./lib/... ./adt/... ./app/... ./pool/... ./proc/...
