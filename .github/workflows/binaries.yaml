name: Binaries

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  merge_group:
    branches: [main]
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: true
          cache_key: "{{default}}-pipe"
          install: true
          cache_save_post: true

      - name: Run Binaries gate
        run: mise run binaries:gate

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: go-engine-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/go-engine
            dist/go-engine.provenance.json
          if-no-files-found: error
          retention-days: 7
