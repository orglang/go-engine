version: '3'

includes:
  db:
    taskfile: ./db/taskfile.yaml
    dir: ./db
  engine:
    taskfile: ./cmd/engine/taskfile.yaml
    dir: .

vars:
  # process supervisor
  PSV: shell # shell, docker

tasks:
  tools:install:
    desc: Download tooling dependencies declared in gear.mod
    cmds:
      - GOWORK=off go get -tool -modfile=gear.mod github.com/golangci/golangci-lint/v2/cmd/golangci-lint github.com/jmattheis/goverter/cmd/goverter github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen

  gear:sum:
    desc: Generate checksums for tooling dependencies
    cmds:
      - GOWORK=off go mod download -modfile=gear.mod all

  binaries:
    desc: Build application binaries
    cmds:
      - task: sources:generate
      - task: engine:binary

  sources:check:
    desc: Check prepared source artifact
    cmds:
      - task: tools:install
      - GOWORK=off go tool -modfile=gear.mod goverter gen -global 'skipCopySameType' ./...
      - GOWORK=off go tool -modfile=gear.mod golangci-lint fmt --diff
      - GOWORK=off go tool -modfile=gear.mod golangci-lint run ./...

  sources:prepare:
    desc: Prepare source artifact
    cmds:
      - gofmt -s -w .
      - task: sources:generate

  sources:generate:
    desc: Generate source artifacts with goverter
    cmds:
      - task: tools:install
      - GOWORK=off go tool -modfile=gear.mod goverter gen -global 'skipCopySameType' ./...

  api:generate:
    desc: Generate the Echo HTTP server from OpenAPI
    cmds:
      - GOWORK=off go tool -modfile=gear.mod oapi-codegen -config internal/app/web/api/cfg.yaml openapi/openapi.yaml

  specs:generate:
    desc: Generate OpenAPI from TypeSpec
    dir: tsp
    cmds:
      - npm run build

  specs:check:
    desc: Check TypeSpec compilation and generated OpenAPI
    cmds:
      - task: specs:generate
      - test -f openapi/openapi.yaml
      - test -z "$(git status --porcelain -- openapi/openapi.yaml)"

  specs:verify:
    desc: Verify specs before publishing
    cmds:
      - task: specs:check

  hooks:install:
    desc: Configure this repository to use versioned Git hooks
    cmds:
      - git config core.hooksPath .githooks

  process:
    aliases: [proc]
    desc: Run specified process in foreground
    cmds:
      - task: engine:process

  container:
    aliases: [cnt]
    desc: Start specified container in background
    cmds:
      - cmd: container started

  processes:
    aliases: [procs]
    desc: Run and interrupt all processes
    cmds:
      - task: engine:process

  tests:*:
    desc: Run tests of specified level (unit, it, e2e).
    vars:
      LEVEL: '{{index .MATCH 0}}'
    cmds:
      - cmd: go test -tags=unit ./internal/lib/... ./internal/adt/... ./internal/app/... ./cmd/... ./internal/pool/... ./internal/proc/... ./internal/prog/... ./internal/proto/...
        if: '{{eq .LEVEL "unit"}}'
      - cmd: go test -run=TestIntegration ./internal/lib/... ./internal/adt/... ./internal/app/... ./cmd/...
        if: '{{eq .LEVEL "it"}}'
      - cmd: go test -failfast ./test/...
        if: '{{eq .LEVEL "e2e"}}'
