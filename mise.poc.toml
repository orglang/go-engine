# Experimental native-mise implementation for issue #97.
# Load alongside mise.toml with: mise -E poc run <task>
# Taskfile remains the baseline; these tasks deliberately use a separate namespace.

[tasks."poc:specs:deps"]
description = "Install TypeSpec dependencies (native mise PoC)"
tools = { node = "26.10.0" }
dir = "tsp"
run = "npm ci --no-audit --no-fund"

[tasks."poc:specs:generate"]
description = "Generate OpenAPI from TypeSpec (native mise PoC)"
tools = { node = "26.10.0" }
dir = "tsp"
run = "npm run build"

[tasks."poc:specs:lint"]
description = "Lint TypeSpec without modifying files (native mise PoC)"
tools = { node = "26.10.0" }
dir = "tsp"
run = 'npm exec -- tsp format --check "**/*.tsp"'

[tasks."poc:specs:analyze"]
description = "Analyze TypeSpec without emitting artifacts (native mise PoC)"
tools = { node = "26.10.0" }
dir = "tsp"
run = "npm exec -- tsp compile . --no-emit"

[tasks."poc:specs:gate"]
description = "Run the TypeSpec gate without Task"
tools = { node = "26.10.0" }
run = [
  "mise -E poc run poc:specs:deps",
  "mise -E poc run poc:specs:generate",
  "mise -E specs lock",
  'test -z "$(git status --porcelain -- mise.specs-dev.lock tsp/package-lock.json)"',
  "test -f openapi/openapi.yaml",
  'test -z "$(git status --porcelain -- openapi/openapi.yaml)"',
  "mise -E poc run poc:specs:lint",
  "mise -E poc run poc:specs:analyze",
]

[tasks."poc:sources:generate"]
description = "Generate source artifacts without Task"
tools = {
  "go:github.com/jmattheis/goverter/cmd/goverter" = "v1.11.1",
  "go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "v2.8.2",
}
run = [
  "oapi-codegen -config internal/lib/e2e/api/cfg.yaml openapi/openapi.yaml",
  "go tool ent generate --target internal/pool/ent ./internal/pool/ent/schema",
  "go tool ent generate --feature sql/upsert --target internal/proc/ent ./internal/proc/ent/schema",
  "goverter gen -global 'skipCopySameType' ./...",
  "oapi-codegen -config internal/app/web/api/cfg.yaml openapi/openapi.yaml",
]

[tasks."poc:sources:lint"]
description = "Run Go linting without Task"
tools = { "go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "v2.15.0" }
run = "golangci-lint run --disable staticcheck --disable depguard ./..."

[tasks."poc:sources:analyze"]
description = "Run Go static and architecture analysis without Task"
tools = { "go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "v2.15.0" }
run = [
  "go vet ./...",
  "golangci-lint run --enable-only staticcheck,depguard ./...",
]

[tasks."poc:sources:gate"]
description = "Run the Sources gate without Task"
tools = {
  "go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "v2.15.0",
  "go:github.com/jmattheis/goverter/cmd/goverter" = "v1.11.1",
  "go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "v2.8.2",
}
run = [
  "mise -E sources lock",
  "mise -E poc run poc:sources:generate",
  'test -z "$(git status --porcelain -- mise.sources-dev.lock)"',
  "test -z \"$(git status --porcelain -- ':(glob)**/*.gen.go' ':(glob)**/ent/**')\"",
  "golangci-lint fmt --diff",
  "mise -E poc run poc:sources:lint",
  "mise -E poc run poc:sources:analyze",
]

[tasks."poc:binaries:build"]
description = "Build application binaries without Task"
run = "go build -o engine ./cmd/engine"

[tasks."poc:binaries:unit-test"]
description = "Run unit tests"
run = "go test -tags=unit ./internal/... ./cmd/..."

[tasks."poc:binaries:integration-test"]
description = "Run integration tests"
run = "go test -run=TestIntegration ./internal/... ./cmd/... ./test/it/..."


[tasks."poc:binaries:lock"]
description = "Refresh Go module and root toolchain lockfiles"
run = [
  "GOWORK=off go mod tidy",
  "mise lock",
]

[tasks."poc:binaries:check"]
description = "Check Go module and toolchain lockfiles without Task"
run = [
  "mise -E poc run poc:binaries:lock",
  "git status --short -- go.mod go.sum mise.lock",
  'test -z "$(git status --porcelain -- go.mod go.sum mise.lock)"',
]

[tasks."poc:binaries:gate"]
description = "Run the complete Engine gate without Task"
run = [
  "mise -E poc run poc:specs:gate",
  "mise -E poc run poc:sources:gate",
  "mise -E poc run poc:binaries:check",
  "mise -E poc run poc:binaries:unit-test",
  "mise -E poc run poc:binaries:build",
  "mise -E poc run poc:binaries:integration-test",
]

[tasks."poc:tests:e2e"]
description = "Run E2E tests without Task"
run = "go test -failfast ./test/..."
