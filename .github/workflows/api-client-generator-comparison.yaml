          GO
      - name: Test generated oapi-codegen package
        working-directory: ${{ runner.temp }}
        run: |
          go get ./oapi-codegen
          go test ./oapi-codegen/...
      - name: Record generated dependency footprints
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p "$RUNNER_TEMP/comparison"
          for package in ogen-no-recursion oapi-codegen; do
            go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' "./$package/..." \
              | sed '/^$/d' | sort -u > "$RUNNER_TEMP/comparison/$package-dependency-packages.txt"
            go list -deps -f '{{if not .Standard}}{{if .Module}}{{.Module.Path}}{{end}}{{end}}' "./$package/..." \
              | sed '/^$/d' | sort -u > "$RUNNER_TEMP/comparison/$package-dependency-modules.txt"
            wc -l "$RUNNER_TEMP/comparison/$package-dependency-packages.txt" \
              | tee "$RUNNER_TEMP/comparison/$package-dependency-package-count.txt"
            wc -l "$RUNNER_TEMP/comparison/$package-dependency-modules.txt" \
              | tee "$RUNNER_TEMP/comparison/$package-dependency-module-count.txt"
          done
      - name: Record generated output sizes
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/comparison"
          cp "$RUNNER_TEMP/openapi.sha256" "$RUNNER_TEMP/comparison/"
          cp "$RUNNER_TEMP/ogen.log" "$RUNNER_TEMP/comparison/" || true
          cp "$RUNNER_TEMP/ogen-no-recursion.log" "$RUNNER_TEMP/comparison/" || true
          cp "$RUNNER_TEMP/ogen-no-recursion.exit" "$RUNNER_TEMP/comparison/" || true
          cp "$RUNNER_TEMP/ogen-without-pool-steps.log" "$RUNNER_TEMP/comparison/" || true
          cp "$RUNNER_TEMP/ogen-without-pool-steps.exit" "$RUNNER_TEMP/comparison/" || true
          cp "$RUNNER_TEMP/ogen-pool-types-post-only.log" "$RUNNER_TEMP/comparison/" || true
          cp "$RUNNER_TEMP/ogen-pool-types-post-only.exit" "$RUNNER_TEMP/comparison/" || true
          cp "$RUNNER_TEMP/ogen-pool-types-no-recursion.log" "$RUNNER_TEMP/comparison/" || true
          cp "$RUNNER_TEMP/ogen-pool-types-no-recursion.exit" "$RUNNER_TEMP/comparison/" || true
          cp "$RUNNER_TEMP/ogen-spawn-no-recursion.log" "$RUNNER_TEMP/comparison/" || true
          cp "$RUNNER_TEMP/ogen-spawn-no-recursion.exit" "$RUNNER_TEMP/comparison/" || true
          cp "$RUNNER_TEMP/openapi-spawn-no-recursion.yaml" "$RUNNER_TEMP/comparison/" || true
          cp "$RUNNER_TEMP/openapi-pool-types-post-only.yaml" "$RUNNER_TEMP/comparison/" || true
          cp "$RUNNER_TEMP/openapi-pool-types-no-recursion.yaml" "$RUNNER_TEMP/comparison/" || true
          cp "$RUNNER_TEMP/openapi-without-pool-steps.yaml" "$RUNNER_TEMP/comparison/" || true
          cp "$RUNNER_TEMP/openapi-no-recursion.yaml" "$RUNNER_TEMP/comparison/" || true
          if [ -d "$RUNNER_TEMP/ogen-spawn-no-recursion" ]; then
            du -sb "$RUNNER_TEMP/ogen-spawn-no-recursion" | tee "$RUNNER_TEMP/comparison/ogen-spawn-no-recursion-size.txt"
            cp -R "$RUNNER_TEMP/ogen-spawn-no-recursion" "$RUNNER_TEMP/comparison/ogen-spawn-no-recursion"
          fi
          if [ -d "$RUNNER_TEMP/ogen-pool-types-no-recursion" ]; then
            du -sb "$RUNNER_TEMP/ogen-pool-types-no-recursion" | tee "$RUNNER_TEMP/comparison/ogen-pool-types-no-recursion-size.txt"
            cp -R "$RUNNER_TEMP/ogen-pool-types-no-recursion" "$RUNNER_TEMP/comparison/ogen-pool-types-no-recursion"
          fi
          if [ -d "$RUNNER_TEMP/ogen-no-recursion" ]; then
            du -sb "$RUNNER_TEMP/ogen-no-recursion" | tee "$RUNNER_TEMP/comparison/ogen-no-recursion-size.txt"
            cp -R "$RUNNER_TEMP/ogen-no-recursion" "$RUNNER_TEMP/comparison/ogen-no-recursion"
          fi
          if [ -d "$RUNNER_TEMP/ogen" ]; then
            du -sb "$RUNNER_TEMP/ogen" | tee "$RUNNER_TEMP/comparison/ogen-size.txt"
            cp -R "$RUNNER_TEMP/ogen" "$RUNNER_TEMP/comparison/ogen"
          fi
          if [ -d "$RUNNER_TEMP/oapi-codegen" ]; then
            du -sb "$RUNNER_TEMP/oapi-codegen" | tee "$RUNNER_TEMP/comparison/oapi-codegen-size.txt"
            cp -R "$RUNNER_TEMP/oapi-codegen" "$RUNNER_TEMP/comparison/oapi-codegen"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-client-generator-comparison
          path: ${{ runner.temp }}/comparison/
          if-no-files-found: error
