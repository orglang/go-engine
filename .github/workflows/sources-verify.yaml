name: Sources

on:
  # Keep the default-branch Go cache warm for reuse by pull request workflows.
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types:
      - opened
      - ready_for_review
      - synchronize
  # Run the same verification against the merge-group commit.
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  sources-gate:
    name: Sources Gate
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout engine
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: true
          cache_key: "{{default}}-sources"
          install: true
          # Defer saving until later environment-specific installs have populated the cache.
          cache_save_post: true

      - name: Install sources toolchain
        run: mise -E sources install --locked

      - name: Check sources
        run: mise -E sources exec -- task sources:check
