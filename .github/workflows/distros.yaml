name: Distros Workflow

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - ready_for_review
      - synchronize
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distros:
    uses: orglang/go-workspace/.github/workflows/distros.yaml@1826e8e915190d4bf37befd7169d35533c253446
    with:
      engine_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      sdk_ref: main
      workspace_ref: fix/go-engine-16-db-ready
      run: true
