name: Specs

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types:
      - opened
      - ready_for_review
      - synchronize
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  specs-gate:
    name: Specs Gate
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: true
          cache_key: "{{default}}-specs"
          install: true
          # Defer saving until later environment-specific installs have populated the cache.
          cache_save_post: true

      - name: Install specs toolchain
        run: mise -E specs install --locked

      - name: Install TypeSpec dependencies
        run: mise run deps:install

      - name: Check specs
        run: mise -E specs exec -- task specs:check
