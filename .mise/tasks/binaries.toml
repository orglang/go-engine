[tasks."binaries:lock"]
description = "Refresh Go module and root toolchain lockfiles"
run = [
  "GOWORK=off go mod tidy",
  "mise lock",
]

[tasks."binaries:check"]
description = "Check Go module and toolchain lockfiles"
run = [
  { task = "binaries:lock" },
  "git status --short -- go.mod go.sum mise.lock",
  'test -z "$(git status --porcelain -- go.mod go.sum mise.lock)"',
]

[tasks."binaries:build"]
description = "Build application binaries"
run = "go build -o engine ./cmd/engine"

[tasks."binaries:unit-test"]
description = "Run unit tests"
run = "go test -tags=unit ./internal/... ./cmd/..."

[tasks."binaries:integration-test"]
description = "Run integration tests"
run = "go test -run=TestIntegration ./internal/... ./cmd/... ./test/it/..."

[tasks."binaries:gate"]
description = "Run Specs, Sources, then Binaries in the CI pipeline"
depends = ["sources:gate"]
run = [
  { task = "binaries:check" },
  { task = "binaries:unit-test" },
  { task = "binaries:build" },
  { task = "binaries:integration-test" },
]
sources = ["@group:common", "@group:binaries"]
outputs = []
