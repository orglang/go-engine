name: sources

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  sources:
    uses: orglang/go-workspace/.github/workflows/engine-ci.yaml@ci/18-sources-gate
    with:
      engine_ref: ${{ github.event.pull_request.head.sha }}
      sdk_ref: main
      workspace_ref: ci/18-sources-gate
      stage: sources
    permissions:
      contents: read
