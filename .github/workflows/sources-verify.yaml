name: Sources Verify

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types:
      - opened
      - ready_for_review
      - synchronize

permissions:
  contents: read

jobs:
  sources-verify:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: false

      - name: Verify dependencies
        run: mise run deps:check

      - name: Verify sources
        run: task sources:check

      - name: Run unit tests
        run: task tests:unit
