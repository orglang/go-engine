name: Generation

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generation:
    if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: true
          cache_key: "{{default}}-sources"
          cache_save_post: true

      - name: Lock dependencies
        run: |
          mise run specs:lock
          mise run binaries:lock

      - name: Install dependencies
        run: mise run deps:install

      - name: Generate specs
        run: mise run specs:generate

      - name: Generate sources
        run: mise run sources:generate

      - name: Commit sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git diff --cached --check
          git commit -m "chore(generated): refresh artifacts [generated]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
