version: '3'

includes:
  db:
    taskfile: ./db/taskfile.yaml
    dir: ./db
  engine:
    taskfile: ./cmd/engine/taskfile.yaml
    dir: .

vars:
  # process supervisor
  PSV: shell # shell, docker

tasks:
  binaries:
    desc: Check Go dependencies, run tests, and build application binaries
    cmds:
      - task: binaries:check
      - task: tests:unit
      - task: binaries:test
      - task: binaries:build

  binaries:check:
    desc: Check Go module and toolchain lockfiles
    deps:
      - task: binaries:lock
    cmds:
      - git status --short -- go.mod go.sum mise.lock
      - test -z "$(git status --porcelain -- go.mod go.sum mise.lock)"

  binaries:lock:
    desc: Refresh Go module and root toolchain lockfiles
    cmds:
      - GOWORK=off go mod tidy
      - mise lock

  binaries:test:
    desc: Run integration tests required for binary delivery
    cmds:
      - task: tests:it

  binaries:build:
    desc: Build application binaries
    cmds:
      - task: engine:binary

  sources:check:
    desc: Verify generated sources, tool locks, and linters
    deps:
      - task: sources:generate
      - task: sources:lock
    cmds:
      - test -z "$(git status --porcelain -- mise.sources-dev.lock)"
      - test -z "$(git status --porcelain -- ':(glob)**/*.gen.go')"
      - golangci-lint fmt --diff
      - golangci-lint run ./...

  sources:lock:
    desc: Refresh source toolchain lockfiles
    cmds:
      - mise -E sources lock

  sources:prepare:
    desc: Generate source artifacts and format handwritten Go code
    cmds:
      - task: sources:generate
      - golangci-lint fmt

  sources:generate:
    desc: Generate source artifacts
    cmds:
      # Generate the E2E client first: Goverter loads ./... and needs this package
      # to exist even on a clean checkout.
      - oapi-codegen -config internal/lib/e2e/api/cfg.yaml openapi/openapi.yaml
      # Build in the project module: Ent's standalone install graph has an old x/tools for Go 1.27.
      - mise run tools:ent:install
      - ent generate --target internal/pool/ent ./internal/pool/ent/schema
      - goverter gen -global 'skipCopySameType' ./...
      - oapi-codegen -config internal/app/web/api/cfg.yaml openapi/openapi.yaml

  specs:generate:
    desc: Generate OpenAPI from TypeSpec
    dir: tsp
    cmds:
      - npm run build

  specs:check:
    desc: Check TypeSpec compilation, dependency locks, and generated OpenAPI
    deps:
      - task: specs:generate
      - task: specs:lock
    cmds:
      - test -z "$(git status --porcelain -- mise.specs-dev.lock tsp/package-lock.json)"
      - test -f openapi/openapi.yaml
      - test -z "$(git status --porcelain -- openapi/openapi.yaml)"

  specs:lock:
    desc: Refresh specs toolchain and npm dependency lockfiles
    cmds:
      - mise -E specs lock
      - npm install --prefix tsp --package-lock-only --ignore-scripts --no-audit --no-fund

  specs:verify:
    desc: Verify specs before publishing
    cmds:
      - task: specs:check

  hooks:install:
    desc: Configure this repository to use versioned Git hooks
    cmds:
      - git config core.hooksPath .githooks

  process:
    aliases: [proc]
    desc: Run specified process in foreground
    cmds:
      - task: engine:process

  container:
    aliases: [cnt]
    desc: Start specified container in background
    cmd: container started

  processes:
    aliases: [procs]
    desc: Run and interrupt all processes
    cmds:
      - task: engine:process

  tests:*:
    desc: Run tests of specified level (unit, it, e2e).
    vars:
      LEVEL: '{{index .MATCH 0}}'
    cmds:
      - cmd: go test -tags=unit ./internal/... ./cmd/...
        if: '{{eq .LEVEL "unit"}}'
      - cmd: go test -run=TestIntegration ./internal/... ./cmd/... ./test/it/...
        if: '{{eq .LEVEL "it"}}'
      - cmd: go test -failfast ./test/...
        if: '{{eq .LEVEL "e2e"}}'
