version: '3'

includes:
  db:
    taskfile: ./db/taskfile.yaml
    dir: ./db
  engine:
    taskfile: ./cmd/engine/taskfile.yaml
    dir: .

vars:
  # process supervisor
  PSV: shell # shell, docker

tasks:
  binaries:
    desc: Check, test, build, and integration-test application binaries
    cmds:
      - task: binaries:gate

  binaries:check:
    desc: Check Go dependencies and toolchain lockfiles
    deps:
      - task: binaries:lock
    cmds:
      - git status --short -- go.mod go.sum mise.lock
      - test -z "$(git status --porcelain -- go.mod go.sum mise.lock)"

  binaries:lock:
    desc: Refresh Go module and root toolchain lockfiles
    cmds:
      - GOWORK=off go mod tidy
      - mise lock

  binaries:unit-test:
    desc: Run unit tests before building the binary
    cmds:
      - task: tests:unit

  binaries:build:
    desc: Build the distributable binary
    cmds:
      - mkdir -p dist
      - CGO_ENABLED=0 go build -o dist/go-engine ./cmd/engine

  binaries:integration-test:
    desc: Run integration tests after the distributable binary is built
    cmds:
      - task: tests:it

  binaries:gate:
    desc: Run unit tests, build the binary, then run integration tests
    cmds:
      - task: binaries:check
      - task: binaries:unit-test
      - task: binaries:build
      - task: binaries:integration-test

  sources:check:
    desc: Verify generated sources, tool locks, and formatting
    deps:
      - task: sources:generate
      - task: sources:lock
    cmds:
      - test -z "$(git status --porcelain -- mise.sources-dev.lock)"
      - test -z "$(git status --porcelain -- ':(glob)**/*.gen.go')"
      - golangci-lint fmt --diff

  sources:lock:
    desc: Refresh source toolchain lockfiles
    cmds:
      - mise -E sources lock

  sources:prepare:
    desc: Generate sources, refresh lockfiles, and format handwritten Go code
    cmds:
      - task: sources:generate
      - task: sources:lock
      - golangci-lint fmt

  sources:generate:
    desc: Generate source artifacts
    cmds:
      # Generate the E2E client first: Goverter loads ./... and needs this package
      # to exist even on a clean checkout.
      - oapi-codegen -config internal/lib/e2e/api/cfg.yaml openapi/openapi.yaml
      # TODO: Move Ent CLI to mise's Go backend once its standalone dependency graph
      # uses x/tools compatible with Go 1.27 export data; verify installation and generation in CI.
      - go tool ent generate --target internal/pool/ent ./internal/pool/ent/schema
      - goverter gen -global 'skipCopySameType' ./...
      - oapi-codegen -config internal/app/web/api/cfg.yaml openapi/openapi.yaml

  sources:gate:
    desc: Verify generated source and lockfile freshness
    cmds:
      - task: sources:check

  sources:lint:
    desc: Run Go linting without modifying source files
    cmds:
      - golangci-lint run ./...

  sources:analyze:
    desc: Run static and architecture analysis
    cmds:
      - go vet ./...
      - golangci-lint run --enable-only depguard ./...

  specs:generate:
    desc: Generate OpenAPI from TypeSpec
    dir: tsp
    cmds:
      - npm run build

  specs:lock:
    desc: Refresh TypeSpec toolchain and npm dependency lockfiles
    cmds:
      - mise -E specs lock
      - npm install --prefix tsp --package-lock-only --ignore-scripts --no-audit --no-fund

  specs:prepare:
    desc: Format TypeSpec, generate OpenAPI, and refresh specification lockfiles
    cmds:
      - cd tsp && npx tsp format "**/*.tsp"
      - task: specs:generate
      - task: specs:lock

  specs:check:
    desc: Verify TypeSpec outputs and dependency lockfiles are current
    deps:
      - task: specs:generate
      - task: specs:lock
    cmds:
      - test -z "$(git status --porcelain -- mise.specs-dev.lock tsp/package-lock.json)"
      - test -f openapi/openapi.yaml
      - test -z "$(git status --porcelain -- openapi/openapi.yaml)"
      - cd tsp && npx tsp format --check "**/*.tsp"

  specs:gate:
    desc: Check specification formatting, generated outputs, and lockfiles
    cmds:
      - task: specs:check

  specs:lint:
    desc: Check TypeSpec formatting and compiler lint diagnostics without modifying files
    dir: tsp
    cmds:
      - npx tsp format --check "**/*.tsp"
      - npx tsp compile . --no-emit --warn-as-error

  specs:analyze:
    desc: Analyze HTTP API semantics without emitting artifacts
    dir: tsp
    cmds:
      - npx tsp compile . --no-emit --warn-as-error --linter-ruleset @typespec/http/all

  specs:verify:
    desc: Verify specifications before committing the prepared artifact
    cmds:
      - task: specs:gate

  hooks:install:
    desc: Configure this repository to use versioned Git hooks
    cmds:
      - git config core.hooksPath .githooks

  process:
    aliases: [proc]
    desc: Run specified process in foreground
    cmds:
      - task: engine:process

  container:
    aliases: [cnt]
    desc: Start specified container in background
    cmd: container started

  processes:
    aliases: [procs]
    desc: Run and interrupt all processes
    cmds:
      - task: engine:process

  tests:*:
    desc: Run tests of specified level (unit, it, e2e).
    vars:
      LEVEL: '{{index .MATCH 0}}'
    cmds:
      - cmd: go test -tags=unit ./internal/... ./cmd/...
        if: '{{eq .LEVEL "unit"}}'
      - cmd: go test -run=TestIntegration ./internal/... ./cmd/... ./test/it/...
        if: '{{eq .LEVEL "it"}}'
      - cmd: go test -failfast ./test/...
        if: '{{eq .LEVEL "e2e"}}'
