name: Specs Pipe

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  specs:
    name: Specs
    runs-on: ubuntu-latest
    steps:
      - name: Check whether commit belongs to an open pull request
        id: pull-request
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.state == "open")] | length')
          echo "has_open_pr=$([[ "$count" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Checkout engine
        if: ${{ github.event_name != 'push' || steps.pull-request.outputs.has_open_pr == 'false' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up mise
        if: ${{ github.event_name != 'push' || steps.pull-request.outputs.has_open_pr == 'false' }}
        uses: jdx/mise-action@v5
        with:
          cache: true
          cache_key: "{{default}}-pipe"
          install: true
          cache_save_post: true

      - name: Run Specs gate pipeline
        if: ${{ github.event_name != 'push' || steps.pull-request.outputs.has_open_pr == 'false' }}
        run: mise run specs:gate
