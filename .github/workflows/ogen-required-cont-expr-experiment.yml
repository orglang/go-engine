name: Ogen required cont_expr pointer-boxing experiment

on:
  push:
    branches:
      - experiment/ogen-cont-expr-required-pointer-boxing

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
      - uses: jdx/mise-action@v3
        with:
          install: true
      - uses: go-task/setup-task@v1
        with:
          version: 3.x
      - name: Install TypeSpec dependencies
        run: npm ci --prefix tsp
      - name: Regenerate required OpenAPI from TypeSpec
        run: task specs:generate
      - name: Normalize OpenAPI for ogen
        run: node tsp/scripts/normalize-openapi-for-ogen.mjs openapi/openapi.yaml /tmp/openapi-ogen-required.yaml
      - name: Scope OpenAPI to Pool.Term recursion operations
        run: node tsp/scripts/filter-openapi-for-optional-cont-expr.mjs /tmp/openapi-ogen-required.yaml /tmp/openapi-ogen-required-scoped.yaml
      - name: Confirm unmodified ogen rejects the recursive schema
        run: |
          if GOMODCACHE=/tmp/ogen-required-unpatched GOWORK=off go run github.com/ogen-go/ogen/cmd/ogen@v1.25.0 \
            --config prototypes/api-client/ogen.yml \
            --target /tmp/ogen-required-unpatched-client \
            --package ogenclient --clean /tmp/openapi-ogen-required-scoped.yaml > /tmp/ogen-required-unpatched.log 2>&1; then
            echo "Expected unmodified ogen to reject the recursive schema"
            exit 1
          fi
          grep -q "infinite recursion" /tmp/ogen-required-unpatched.log
          cat /tmp/ogen-required-unpatched.log
      - name: Apply isolated required-pointer-boxing change
        run: |
          GOMODCACHE=/tmp/ogen-required-gomodcache GOWORK=off go mod download github.com/ogen-go/ogen@v1.25.0
          ogen_file="/tmp/ogen-required-gomodcache/github.com/ogen-go/ogen@v1.25.0/gen/generics.go"
          chmod u+w "$ogen_file"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("/tmp/ogen-required-gomodcache/github.com/ogen-go/ogen@v1.25.0/gen/generics.go")
          source = path.read_text()
          old = 'return nil, errors.Errorf("infinite recursion: %s.%s is required", s.Name, field.Name)'
          new = '// Required recursive fields need indirection to keep the Go value representation finite.\\n\\t\\t\\t\\treturn ir.Pointer(t, ir.NilInvalid), nil'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one required-recursion error site, found {count}")
          path.write_text(source.replace(old, new, 1))
          PY
          grep -n -B2 -A2 'NilInvalid' "$ogen_file"
      - name: Generate client with pointer-boxing ogen v1.25.0
        run: |
          GOMODCACHE=/tmp/ogen-required-gomodcache GOWORK=off go run github.com/ogen-go/ogen/cmd/ogen@v1.25.0 \
            --config prototypes/api-client/ogen.yml \
            --target prototypes/api-client/ogen-required-experiment/generated \
            --package ogenclient --clean /tmp/openapi-ogen-required-scoped.yaml
      - name: Compile and test required JSON contract
        run: |
          cp prototypes/api-client/ogen/pool_term_required_cont_expr_test.go prototypes/api-client/ogen-required-experiment/generated/
          cp go.mod /tmp/ogen-required.mod
          cp go.sum /tmp/ogen-required.sum
          go mod edit -modfile=/tmp/ogen-required.mod -require=github.com/ogen-go/ogen@v1.25.0
          GOWORK=off go test -mod=mod -modfile=/tmp/ogen-required.mod ./prototypes/api-client/ogen-required-experiment/generated
