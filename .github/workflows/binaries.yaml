name: Binaries

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: true
          cache_key: "{{default}}-pipe"
          install: true
          cache_save_post: true

      - name: Run Binaries gate
        run: mise run binaries:gate

      - name: Report generated source drift
        if: failure()
        run: |
          git status --short -- ':(glob)**/*.gen.go' ':(glob)**/ent/**'
          git diff -- ':(glob)**/*.gen.go' ':(glob)**/ent/**'
