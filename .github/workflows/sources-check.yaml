name: Sources Check

on:
  workflow_call:
  pull_request:
    branches: [main]
    types:
      - opened

permissions:
  contents: read

jobs:
  sources-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Check formatting
        run: test -z "$(gofmt -s -l .)"

      - name: Run unit tests
        run: go test -tags=unit ./lib/... ./adt/... ./app/... ./pool/... ./proc/...
