[settings]
lockfile = true
experimental = true

[tools]
go = "1.27.0"
"go:github.com/go-task/task/v3/cmd/task" = "v3.54.0"

[tasks."deps:install"]
description = "Install TypeSpec dependencies"
tools = { node = "26.10.0" }
run = "npm ci --prefix tsp --no-audit --no-fund"
sources = ["tsp/package.json", "tsp/package-lock.json"]
outputs = ["tsp/node_modules"]

# Reusable source groups keep stage-owned input paths in one place.
# Stage gates compose these groups to reflect the downstream impact mapping.
[task_config.input_groups]
common = [
  ".github/**",
  "taskfile.yaml",
  "**/taskfile.yaml",
  "mise.lock",
  ".miserc.toml",
]
specs = [
  "tsp/**",
  "openapi/openapi.yaml",
  "mise.specs-dev.toml",
  "mise.specs-dev.lock",
]
sources = [
  "*.go",
  "**/*.go",
  "mise.sources-dev.toml",
  "mise.sources-dev.lock",
  ".golangci.yml",
  "staticcheck.conf",
]
binaries = [
  "*.sql",
  "**/*.sql",
  "go.mod",
  "go.sum",
  "**/go.mod",
  "**/go.sum",
]

# Keep generator tools available whenever source generation is invoked directly.
[tasks."sources:generate"]
description = "Generate source artifacts"
tools = {
  "go:github.com/jmattheis/goverter/cmd/goverter" = "v1.11.1",
  "go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "v2.8.2",
}
run = "task sources:generate"

# The gate chain follows the pipeline order. Each task declares only its
# own stage inputs; dependencies provide the cumulative execution order.
[tasks."specs:gate"]
description = "Run Specs in the CI pipeline"
tools = { node = "26.10.0" }
depends = ["deps:install"]
run = "task specs:gate"
sources = ["@group:common", "@group:specs"]
outputs = []

[tasks."sources:gate"]
description = "Run Specs, then Sources in the CI pipeline"
depends = ["specs:gate"]
tools = {
  "go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "v2.15.0",
  "go:github.com/jmattheis/goverter/cmd/goverter" = "v1.11.1",
  "go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "v2.8.2",
}
run = "task sources:gate"
sources = ["@group:sources"]
outputs = []

[tasks."binaries:gate"]
description = "Run Specs, Sources, then Binaries in the CI pipeline"
depends = ["sources:gate"]
run = """
task binaries:check
mise run tests:unit
task binaries:build
mise run tests:it
"""
sources = ["@group:binaries"]
outputs = []

[tasks."tests:unit"]
description = "Run unit tests"
run = "go test -tags=unit ./internal/... ./cmd/..."

[tasks."tests:it"]
description = "Run integration tests"
run = "go test -run=TestIntegration ./internal/... ./cmd/... ./test/it/..."

[tasks."tests:e2e"]
description = "Run end-to-end tests"
run = "go test -failfast ./test/..."
