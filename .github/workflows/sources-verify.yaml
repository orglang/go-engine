name: Sources Verify

on:
  # Keep the default-branch Go cache warm for reuse by pull request workflows.
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize

permissions:
  contents: read

jobs:
  sources-verify:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    env:
      ENTPGX_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/entpgx_test?sslmode=disable
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: entpgx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d entpgx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout engine
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: true
          install: true
          # Defer saving until later environment-specific installs have populated the cache.
          cache_save_post: true

      - name: Install specs and sources toolchains
        run: |
          mise -E specs install --locked
          mise -E sources install --locked

      - name: Check dependencies
        run: mise run deps:check

      - name: Check sources
        run: mise -E sources exec -- task sources:check

      - name: Run unit tests
        run: mise exec -- task tests:unit
