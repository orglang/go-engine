[tools]
node = "22"

[tasks.generate]
description = "Generate temporary API client generator prototypes"
run = "mise run generate:api-client-prototypes"

[tasks."generate:api-client-prototypes"]
description = "Compare ogen and oapi-codegen against the committed OpenAPI contract"
run = [
  "mkdir -p prototypes/api-client/ogen prototypes/api-client/oapi-codegen",
  "GOWORK=off go run github.com/ogen-go/ogen/cmd/ogen@v1.24.0 --config prototypes/api-client/ogen.yml --target prototypes/api-client/ogen --package ogenclient --clean openapi/openapi.yaml",
  "GOWORK=off go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.2 -generate types,client -package oapiclient openapi/openapi.yaml > prototypes/api-client/oapi-codegen/client.gen.go",
]
