["binaries:lock"]
description = "Refresh Go module manifests"
run = "GOWORK=off go mod tidy"

["binaries:check"]
description = "Check Go module manifests"
run = [
  { task = "binaries:lock" },
  'test -z "$(git status --porcelain -- go.mod go.sum)"',
]

["binaries:build"]
description = "Build application binaries"
run = "go build -o engine ./cmd/engine"

["binaries:unit-test"]
description = "Run unit tests"
run = "go test -tags=unit ./internal/... ./cmd/..."

["binaries:integration-test"]
description = "Run integration tests"
run = "go test -run=TestIntegration ./internal/... ./cmd/... ./test/it/..."

["binaries:gate"]
description = "Run Specs, Sources, then Binaries in the CI pipeline"
depends = ["sources:gate"]
run = [
  { task = "binaries:check" },
  { task = "binaries:unit-test" },
  { task = "binaries:build" },
  { task = "binaries:integration-test" },
]
sources = [
  "@group:common",
  "*.sql",
  "**/*.sql",
  "go.mod",
  "go.sum",
  "**/go.mod",
  "**/go.sum",
  ".mise/conf.d/binaries.toml",
]
outputs = []
