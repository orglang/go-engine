name: Ogen optional cont_expr experiment

on:
  push:
    branches:
      - experiment/ogen-cont-expr-optional

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
      - uses: jdx/mise-action@v3
        with:
          install: true
      - uses: go-task/setup-task@v1
        with:
          version: 3.x
      - name: Install TypeSpec dependencies
        run: npm ci --prefix tsp
      - name: Regenerate OpenAPI from the modified TypeSpec source
        run: task specs:generate
      - name: Normalize OpenAPI for ogen
        run: node tsp/scripts/normalize-openapi-for-ogen.mjs openapi/openapi.yaml /tmp/openapi-ogen-optional.yaml
      - name: Confirm unmodified ogen rejects the remaining recursive edge
        run: |
          if GOMODCACHE=/tmp/ogen-optional-unpatched GOWORK=off go run github.com/ogen-go/ogen/cmd/ogen@v1.25.0 \
            --config prototypes/api-client/ogen.yml \
            --target /tmp/ogen-optional-unpatched-client \
            --package ogenclient --clean /tmp/openapi-ogen-optional.yaml > /tmp/ogen-optional-unpatched.log 2>&1; then
            echo "Expected unmodified ogen to reject the recursive schema"
            exit 1
          fi
          grep -q "infinite recursion" /tmp/ogen-optional-unpatched.log
          cat /tmp/ogen-optional-unpatched.log
      - name: Apply the ogen optional-recursion patch
        run: |
          GOMODCACHE=/tmp/ogen-optional-gomodcache GOWORK=off go mod download github.com/ogen-go/ogen@v1.25.0
          ogen_dir="/tmp/ogen-optional-gomodcache/github.com/ogen-go/ogen@v1.25.0"
          chmod -R u+w "$ogen_dir/gen/ir" "$ogen_dir/gen"
          patch -d "$ogen_dir" -p1 < prototypes/api-client/ogen-optional-experiment/0001-optional-recursion-edge-only.patch
      - name: Generate client with patched ogen v1.25.0
        run: |
          GOMODCACHE=/tmp/ogen-optional-gomodcache GOWORK=off go run github.com/ogen-go/ogen/cmd/ogen@v1.25.0 \
            --config prototypes/api-client/ogen.yml \
            --target prototypes/api-client/ogen-optional-experiment/generated \
            --package ogenclient --clean /tmp/openapi-ogen-optional.yaml
      - name: Compile and test optional contract
        run: |
          cp prototypes/api-client/ogen-optional-experiment/optional_cont_expr_test.go prototypes/api-client/ogen-optional-experiment/generated/
          cp go.mod /tmp/ogen-optional.mod
          cp go.sum /tmp/ogen-optional.sum
          go mod edit -modfile=/tmp/ogen-optional.mod -require=github.com/ogen-go/ogen@v1.25.0
          GOWORK=off go test -mod=mod -modfile=/tmp/ogen-optional.mod ./prototypes/api-client/ogen-optional-experiment/generated
