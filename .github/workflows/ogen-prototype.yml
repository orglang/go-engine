name: Ogen prototype validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".mise.toml"
      - "prototypes/api-client/ogen/**"
      - "tsp/package.json"
      - "tsp/package-lock.json"
      - ".github/workflows/ogen-prototype.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Install TypeSpec script dependencies
        run: npm ci --prefix tsp

      - name: Run isolated ogen prototype validation
        run: mise run generate:api-client-prototypes

      - name: Upload generator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogen-prototype-diagnostics
          if-no-files-found: ignore
          path: |
            prototypes/api-client/ogen/*.log
            prototypes/api-client/ogen/*.exit-code
            prototypes/api-client/ogen/probe-*.log
            prototypes/api-client/ogen/probe-*.exit-code
            prototypes/api-client/ogen/probe-summary.txt
