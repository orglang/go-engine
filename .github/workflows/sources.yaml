name: Sources

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - converted_to_draft
      - ready_for_review
      - synchronize
  merge_group:
    branches: [main]
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: true
          cache_key: "{{default}}-pipe"
          install: true
          cache_save_post: true

      - name: Run Specs gate
        run: mise run specs:gate

      - name: Show remaining TypeSpec formatting change
        if: failure()
        working-directory: tsp
        run: |
          npx tsp format "**/*.tsp"
          git diff -- .

      - name: Run Specs lint
        run: mise run specs:lint

      - name: Analyze Specs
        run: mise run specs:analyze

      - name: Run Sources gate
        run: mise run sources:gate

      - name: Lint Sources
        run: mise run sources:lint

      - name: Analyze Sources
        run: mise run sources:analyze
