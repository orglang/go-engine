openapi: 3.1.0
info:
  title: ogen required-edge recursion control
  version: 0.0.0
paths:
  /probe:
    get:
      operationId: probeRequiredCycle
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A'
components:
  schemas:
    A:
      type: object
      required: [b]
      properties:
        b:
          $ref: '#/components/schemas/B'
    B:
      type: object
      required: [c]
      properties:
        c:
          $ref: '#/components/schemas/C'
    C:
      type: object
      required: [b]
      properties:
        b:
          $ref: '#/components/schemas/B'
