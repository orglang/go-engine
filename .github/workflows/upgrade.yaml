name: Upgrade

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          auto_update: true
          install: false

      - name: Upgrade Go
        run: mise upgrade --bump go

      - name: Upgrade remaining mise tools
        run: mise upgrade --bump

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update mise tools"
          title: "chore: update mise tools"
          body: |
            Automated mise toolchain upgrade.

            Configured tools are upgraded across the common, specs, and sources environments.
            Dependency updates are handled separately by Dependabot.
          branch: chore/update-mise-tools
          delete-branch: true
