[settings]
lockfile = true

[tools]
go = "1.27.0"
"go:github.com/go-task/task/v3/cmd/task" = "v3.54.0"

[tasks."deps:lock"]
description = "Tidy Go modules and update mise and npm lockfiles"
run = [
  "GOWORK=off go mod tidy",
  "mise lock",
  "mise -E specs-dev lock",
  "mise -E sources-dev lock",
  "mise -E specs-dev exec -- npm install --prefix tsp --package-lock-only --ignore-scripts --no-audit --no-fund",
]

[tasks."deps:install"]
description = "Download Go modules and install TypeSpec dependencies"
run = [
  "GOWORK=off go mod download",
  "mise -E specs-dev install",
  "mise -E specs-dev exec -- npm ci --prefix tsp --no-audit --no-fund",
]

[tasks."deps:check"]
description = "Check Go module manifests and tool lockfiles"
depends = ["deps:lock"]
run = "test -z \"$(git status --porcelain -- ':(glob)**/*.mod' ':(glob)**/*.sum' ':(glob)**/package-lock.json' 'mise*.lock')\""
