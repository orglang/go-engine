name: Specs Gate

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types:
      - opened
      - ready_for_review
      - synchronize
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      specs: ${{ steps.detect.outputs.specs }}
    steps:
      - name: Checkout engine
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect changed areas
        id: detect
        uses: ./.github/actions/change-detection

  specs-check:
    name: Specs Gate
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.specs == 'true' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          cache: true
          cache_key: "{{default}}-specs"
          install: true
          # Defer saving until later environment-specific installs have populated the cache.
          cache_save_post: true

      - name: Install specs toolchain
        run: mise -E specs install --locked

      - name: Install TypeSpec dependencies
        run: mise run deps:install

      - name: Check specs
        run: mise -E specs exec -- task specs:check
